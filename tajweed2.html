<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>واحة التجويد الكبرى للأطفال والبث المباشر — أكاديمية الفتح</title>
  <link rel="manifest" href="manifest.json">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Amiri+Quran&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at top, #065f46 0%, #064e3b 45%, #022c22 100%);
      font-family: 'Cairo', sans-serif;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      padding-bottom: 60px;
    }

    /* الشريط العلوي */
    .top-header {
      width: 100%;
      background: linear-gradient(90deg, #0f172a, #78350f, #064e3b);
      border-bottom: 3px solid #facc15;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-title {
      font-size: 20px;
      font-weight: 900;
      color: #fef08a;
      display: flex;
      align-items: center;
      gap: 12px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .nav-btn {
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.25);
      color: #fff;
      padding: 8px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      transition: all 0.25s;
    }
    .nav-btn:hover { background: #d97706; transform: scale(1.05); }

    .main-wrapper {
      width: 95vw;
      max-width: 1200px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* شريط الأبواب الأربعة الرئيسية */
    .main-nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }
    .main-nav-btn {
      background: #0f172a;
      border: 2px solid #334155;
      color: #e2e8f0;
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 6px 15px rgba(0,0,0,0.4);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .main-nav-btn:hover { border-color: #38bdf8; transform: translateY(-3px); }
    .main-nav-btn.active {
      background: linear-gradient(135deg, #d97706, #92400e);
      border-color: #facc15;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
      transform: scale(1.02);
    }

    /* شريط التبويبات الثلاثة لكل باب */
    .section-tabs {
      display: flex;
      gap: 10px;
      background: rgba(15, 23, 42, 0.85);
      padding: 8px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .sec-tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 12px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s;
    }
    .sec-tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.5);
    }

    /* شريط الأحكام الفرعية داخل الباب */
    .sub-rules-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      background: rgba(15, 23, 42, 0.6);
      padding: 10px;
      border-radius: 14px;
      border: 1px dashed rgba(245, 158, 11, 0.4);
    }
    .sub-rule-chip {
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.15);
      color: #cbd5e1;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sub-rule-chip.active {
      background: #10b981;
      border-color: #34d399;
      color: #fff;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.5);
    }

    /* صندوق العرض الرئيسي */
    .display-box {
      background: rgba(15, 23, 42, 0.96);
      border: 3px solid #d97706;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.85);
      display: none;
      animation: fadeIn 0.3s ease forwards;
    }
    .display-box.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* كروت الشرح المخصصة للزوم ميتنج */
    .zoom-lesson-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 2px solid #38bdf8;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .zoom-lesson-title {
      font-size: 26px;
      font-weight: 900;
      color: #facc15;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid rgba(255,255,255,0.1);
      padding-bottom: 12px;
    }
    .zoom-step-box {
      background: rgba(2, 132, 199, 0.12);
      border-right: 6px solid #38bdf8;
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 19px;
      line-height: 1.9;
      color: #f1f5f9;
      font-weight: 700;
    }
    .zoom-step-box strong { color: #facc15; }
    .story-note {
      background: rgba(245, 158, 11, 0.16);
      border: 2px dashed #f59e0b;
      border-radius: 16px;
      padding: 18px 24px;
      font-size: 19px;
      color: #fef08a;
      line-height: 1.9;
      font-weight: 800;
    }

    /* كروت الأمثلة الـ 12 العملاقة */
    .examples-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }
    .big-example-card {
      background: linear-gradient(135deg, #1e293b 0%, #0b1329 100%);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      transition: transform 0.25s, border-color 0.25s;
    }
    .big-example-card:hover {
      transform: translateY(-5px);
      border-color: #f59e0b;
      box-shadow: 0 16px 40px rgba(245, 158, 11, 0.3);
    }
    .verse-banner {
      font-family: 'Amiri Quran', serif;
      font-size: 38px;
      line-height: 2.3;
      text-align: center;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
    }
    /* التظليل الثنائي للأحكام */
    .target-char { color: #38bdf8; font-weight: 900; text-shadow: 0 0 12px rgba(56, 189, 248, 0.8); }
    .reason-char { color: #fb923c; font-weight: 900; text-shadow: 0 0 12px rgba(251, 146, 60, 0.8); }
    .ex-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #94a3b8;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 8px;
      font-weight: 800;
    }

    /* بنك الـ 20 تمرين العملاق */
    .quiz-giant-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 22px;
    }
    .quiz-giant-verse {
      font-family: 'Amiri Quran', serif;
      font-size: 44px;
      line-height: 2.2;
      color: #fef08a;
      background: rgba(2, 132, 199, 0.12);
      border: 2.5px dashed #38bdf8;
      border-radius: 20px;
      padding: 24px 36px;
      width: 100%;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    .quiz-giant-q { font-size: 24px; font-weight: 900; color: #ffffff; }
    .quiz-giant-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      max-width: 680px;
    }
    .giant-opt-btn {
      background: rgba(255,255,255,0.07);
      border: 2px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 18px;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s;
    }
    .giant-opt-btn:hover { background: rgba(56, 189, 248, 0.25); border-color: #38bdf8; transform: scale(1.02); }
    .giant-opt-btn.correct { background: #16a34a !important; border-color: #4ade80 !important; color: #fff !important; transform: scale(1.04); }
    .giant-opt-btn.wrong { background: #dc2626 !important; border-color: #f87171 !important; color: #fff !important; }
    .quiz-feedback-box { font-size: 20px; font-weight: 900; min-height: 40px; line-height: 1.7; }
    .giant-next-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      color: #0f172a;
      font-size: 18px;
      font-weight: 900;
      padding: 12px 36px;
      border-radius: 12px;
      cursor: pointer;
      display: none;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
    }

    /* لعبة صائد الأحكام بالزوم */
    .game-giant-arena {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
    }
    .game-target-box {
      width: 100%;
      max-width: 650px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 3px solid #facc15;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 0 30px rgba(250, 204, 21, 0.3);
    }
    .game-target-word { font-family: 'Amiri Quran', serif; font-size: 52px; color: #fef08a; line-height: 2; }
    .game-baskets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      width: 100%;
      max-width: 750px;
    }
    .giant-basket-btn {
      background: rgba(2, 132, 199, 0.18);
      border: 2.5px solid #0284c7;
      color: #fff;
      padding: 18px;
      border-radius: 16px;
      font-size: 19px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.25s;
    }
    .giant-basket-btn:hover { background: #0284c7; transform: scale(1.05); }

    /* النافذة المنبثقة للبطاقات الموسعة (Modal Popups) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      animation: fadeIn 0.25s ease;
    }
    .modal-overlay.active { display: flex; }
    .zoom-modal-content {
      background: #0f172a;
      border: 3px solid #f59e0b;
      border-radius: 24px;
      width: 90vw;
      max-width: 700px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.9);
      position: relative;
    }
    .modal-close-btn {
      position: absolute;
      top: 18px; left: 18px;
      background: #dc2626;
      border: none;
      color: #fff;
      width: 34px; height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="top-title">
      <span>🌟</span>
      <span>واحة التجويد الكبرى لشرح زووم التفاعلي — جزء عم</span>
    </div>
    <a href="index.html" class="nav-btn">↩️ رجوع للسبورة</a>
  </div>

  <div class="main-wrapper">
    <!-- شريط الأبواب الأربعة -->
    <div class="main-nav">
      <button class="main-nav-btn active" data-chapter="noon">النون الساكنة والتنوين (4 أحكام)</button>
      <button class="main-nav-btn" data-chapter="meem">أحكام الميم الساكنة (3 أحكام)</button>
      <button class="main-nav-btn" data-chapter="qalqala">أحكام القلقلة (قُطْبُ جَدّ)</button>
      <button class="main-nav-btn" data-chapter="madd">أحكام المدود (متصل، منفصل، عارض، لازم)</button>
    </div>

    <!-- شريط الأركان الثلاثة -->
    <div class="section-tabs">
      <button class="sec-tab-btn active" data-tab="cards">👨‍🏫 كروت الشرح المفصل (خط كبير للزووم)</button>
      <button class="sec-tab-btn" data-tab="examples">📜 بنك الـ 12 مثالاً بتظليل الحروف</button>
      <button class="sec-tab-btn" data-tab="quiz">📝 20 تمريناً تفاعلياً عملاقاً</button>
      <button class="sec-tab-btn" data-tab="game">🎯 لعبة صائد الأحكام السريعة</button>
    </div>

    <!-- شريط الأحكام الفرعية داخل الباب -->
    <div class="sub-rules-bar" id="subRulesBar"></div>

    <!-- 1. صندوق كروت الشرح المخصص للزووم -->
    <div class="display-box active" id="box_cards">
      <div id="lessonCardContainer"></div>
    </div>

    <!-- 2. صندوق الـ 12 مثالاً العملاقة بتظليل الحروف -->
    <div class="display-box" id="box_examples">
      <h3 style="color:#facc15; font-size:22px; margin-bottom:18px; text-align:center;" id="examplesTitle">12 مثالاً محققاً من جزء عم:</h3>
      <div class="examples-grid" id="examplesGrid"></div>
    </div>

    <!-- 3. صندوق الـ 20 تمريناً -->
    <div class="display-box" id="box_quiz">
      <div class="quiz-giant-card">
        <div style="display:flex; gap:10px; align-items:center;">
          <span style="background:#0284c7; padding:4px 18px; border-radius:20px; font-weight:900;" id="quizCounter">تمرين 1 من 20</span>
          <span style="background:rgba(255,255,255,0.1); padding:4px 14px; border-radius:12px; font-weight:800;" id="quizType">اختيار من متعدد</span>
        </div>
        <div class="quiz-giant-verse" id="quizVerse">﴿ ... ﴾</div>
        <div class="quiz-giant-q" id="quizQ">...</div>
        <div class="quiz-giant-grid" id="quizGrid"></div>
        <div class="quiz-feedback-box" id="quizFeedback"></div>
        <button class="giant-next-btn" id="nextQuizBtn">التالي ❯</button>
      </div>
    </div>

    <!-- 4. صندوق اللعبة -->
    <div class="display-box" id="box_game">
      <div class="game-giant-arena">
        <div style="display:flex; gap:20px; font-size:20px; font-weight:900;">
          <div>🏆 النقاط: <span id="gameScore" style="color:#facc15;">0</span></div>
          <div>🔥 التتابع: <span id="gameStreak" style="color:#4ade80;">0</span></div>
        </div>
        <div class="game-target-box">
          <div style="color:#94a3b8; font-size:16px; margin-bottom:8px;" id="gameSurah">سورة الفلق</div>
          <div class="game-target-word" id="gameWord">﴿ غَاسِقٍ إِذَا ﴾</div>
          <div style="color:#38bdf8; font-size:18px; font-weight:800;">ما هو الحكم التجويدي للشاهد الملون؟</div>
        </div>
        <div class="game-baskets-grid" id="gameBaskets"></div>
      </div>
    </div>
  </div>

  <!-- النافذة المنبثقة للتفاصيل والتكبير -->
  <div class="modal-overlay" id="zoomModal">
    <div class="zoom-modal-content">
      <button class="modal-close-btn" onclick="document.getElementById('zoomModal').classList.remove('active')">✕</button>
      <h3 style="color:#facc15; font-size:24px;" id="modalTitle">شرح تفصيلي موسع</h3>
      <div style="font-size:20px; line-height:2; color:#f8fafc;" id="modalBody"></div>
    </div>
  </div>

  <script>
    // قاعدة البيانات الشاملة: 12 مثالاً بتظليل الحرف الساكن بالأزرق وحرف السبب بالبرتقالي
    const dataBank = {
      noon: {
        title: "النون الساكنة والتنوين",
        subRules: [
          { id: "izhar", name: "1. الإظهار الحلقي" },
          { id: "idgham_g", name: "2. الإدغام بغنة" },
          { id: "idgham_w", name: "3. الإدغام بغير غنة" },
          { id: "iqlab", name: "4. الإقلاب" },
          { id: "ikhfa", name: "5. الإخفاء الحقيقي" }
        ],
        lessons: {
          izhar: {
            title: "شرح الإظهار الحلقي للأطفال (أصدقاء الحلق الستة)",
            steps: [
              "<strong>ما هو الإظهار الحلقي؟</strong> يعني أن ننطق النون الساكنة أو التنوين واضحة وصريحة ونظيفة كالشمس الساطعة، دون أن نزيد في صوت الغنة.",
              "<strong>متى يحدث؟</strong> عندما تأتي النون الساكنة أو التنوين وبعدها واحد من أصدقاء الحلق الستة: <strong>(الهمزة، الهاء، العين، الحاء، الغين، الخاء)</strong>.",
              "<strong>كيف ننطقها أمام الكاميرا للطفل؟</strong> نلصق طرف اللسان بسقف الحلق برقة وننطق النون كاملة ثم ننطق الحرف الحلقي دون وقفة طويلة."
            ],
            story: "✨ قصة للأطفال: النون الساكنة تحب أصدقاءها الذين يسكنون في الحلق؛ فعندما تقابلهم تفرح وتظهر نفسها واضحة وتقول: (أنا النون الواضحة لا أختبئ أبداً)!"
          },
          idgham_g: {
            title: "شرح الإدغام بغنة للأطفال (حفلة الاندماج)",
            steps: [
              "<strong>ما هو الإدغام بغنة؟</strong> يعني دمج النون الساكنة أو التنوين بالكامل في الحرف الذي بعدها، ليصبحا حرفاً واحداً مشدداً ومعه صوت غنة حنونة كالعصفور مدتها حركتان.",
              "<strong>حروفه:</strong> مجموعة في كلمة <strong>(يَنْمُو)</strong>: الياء، النون، الميم، الواو.",
              "<strong>كيف ننطقه؟</strong> لا ننطق نوناً نهائياً، بل نتحول مباشرة إلى الحرف التالي ونخرج صوتاً رناناً من الأنف (الغنة)."
            ],
            story: "✨ قصة للأطفال: النون الساكنة شربت عصير الذوبان وذابت تماماً داخل حروف (ينمو) وتركت وراءها صوت رنة جميلة من الأنف!"
          },
          idgham_w: {
            title: "شرح الإدغام بغير غنة (القطار السريع)",
            steps: [
              "<strong>ما هو؟</strong> إدخال النون الساكنة أو التنوين في الحرف الذي يليها واختفاؤها تماماً دون أي غنة أو تطويل في الصوت.",
              "<strong>حروفه:</strong> حرفان قويان وسريعان فقط هما <strong>(الراء واللام - ر، ل)</strong>.",
              "<strong>التطبيق:</strong> ننتقل مباشرة من الحرف السابق إلى الراء أو اللام مشددة وسريعة مثل: (وَيْلُلِّكُلِّ)."
            ],
            story: "✨ قصة للأطفال: الراء واللام قطار سريع جداً؛ يمر على النون فيبتلعها في طريقه بسرعة دون أن يترك صوتاً للغنة!"
          },
          iqlab: {
            title: "شرح الإقلاب (النون تتحول لميم خفيفة)",
            steps: [
              "<strong>ما هو الإقلاب؟</strong> قلب صوت النون الساكنة أو التنوين إلى حرف ميم (م) خفيفة مع غنة.",
              "<strong>حرفه:</strong> حرف واحد فقط خجول هو <strong>(الباء - ب)</strong>.",

          { verse: "فَإِذَا جَاءَتِ الصَّ<span class='target-char'>ا</span><span class='reason-char'>خَّ</span>ةُ", surah: "عبس (33)", rule: "مد لازم كلمي مثقل (6 حركات)" },
          { verse: "فَإِذَا جَاءَتِ الطَّ<span class='target-char'>ا</span><span class='reason-char'>مَّ</span>ةُ الْكُبْرَى", surah: "النازعات (34)", rule: "مد لازم كلمي مثقل (6 حركات)" },
          { verse: "الَّذِي يُكَذِّبُ بِالدِّي<span class='target-char'>نِ</span>", surah: "الماعون (1)", rule: "مد عارض للسكون (عند الوقف)" },
          { verse: "فَذَلِكَ الَّذِي يَدُعُّ الْيَتِي<span class='target-char'>مَ</span>", surah: "الماعون (2)", rule: "مد عارض للسكون (عند الوقف)" },
          { verse: "قُلْ يَ<span class='target-char'>ا</span> <span class='reason-char'>أَ</span>يُّهَا الْكَافِرُونَ", surah: "الكافرون (1)", rule: "مد جائز منفصل" },
          { verse: "وَلَا أَنْتُمْ عَابِدُو<span class='target-char'>نَ</span>", surah: "الكافرون (3)", rule: "مد عارض للسكون (عند الوقف)" },
          { verse: "عَمَّ يَتَسَ<span class='target-char'>ا</span><span class='reason-char'>ءَ</span>لُونَ", surah: "النبأ (1)", rule: "مد واجب متصل" },
          { verse: "لِإِيلَافِ قُرَيْ<span class='target-char'>شٍ</span>", surah: "قريش (1)", rule: "مد لين عارض للسكون (عند الوقف)" }
        ],
        quizzes: [
          { type: "mcq", verse: "﴿ إِذَا جَاءَ نَصْرُ اللَّهِ ﴾", q: "ما نوع المد في (جَاءَ)؟", opts: ["مد واجب متصل", "مد جائز منفصل", "مد لازم", "مد بدل"], ans: 0, note: "مد واجب متصل لاجتماع المد والهمزة في كلمة واحدة." },
          { type: "tf", verse: "﴿ إِنَّا أَعْطَيْنَاكَ ﴾", q: "المد بين (إِنَّا) و (أَعْطَيْنَاكَ) مد واجب متصل؟", opts: ["صح", "خطأ"], ans: 1, note: "خطأ، مد جائز منفصل لانفصال الهمزة في الكلمة الثانية." },
          { type: "mcq", verse: "﴿ الصَّاخَّةُ ﴾", q: "مقدار مد كلمة (الصَّاخَّةُ):", opts: ["6 حركات لزوماً", "حركتان", "4 حركات", "جائز"], ans: 0, note: "مد لازم كلمي مثقل يمد 6 حركات لزوماً." },
          { type: "tf", verse: "﴿ بِالدِّينِ ﴾", q: "عند الوقف على (بِالدِّينِ) يجوز مدها 2 أو 4 أو 6 حركات؟", opts: ["صح", "خطأ"], ans: 0, note: "صح، لأنه مد عارض للسكون." },
          { type: "mcq", verse: "﴿ وَالسَّمَاءِ ﴾", q: "المد في (وَالسَّمَاءِ) حكمه:", opts: ["واجب متصل", "جائز منفصل", "عارض", "طبيعي"], ans: 0, note: "واجب متصل." },
          { type: "tf", verse: "﴿ الطَّامَّةُ ﴾", q: "نوع المد في (الطَّامَّةُ) مد لازم كلمي مثقل؟", opts: ["صح", "خطأ"], ans: 0, note: "صح، لمجيء الميم المشددة بعد الألف." },
          { type: "mcq", verse: "﴿ وَمَا أَدْرَاكَ ﴾", q: "المد في (وَمَا أَدْرَاكَ) هو:", opts: ["مد جائز منفصل", "مد متصل", "مد لازم", "مد بدل"], ans: 0, note: "مد جائز منفصل." },
          { type: "tf", verse: "﴿ قُلْ يَا أَيُّهَا الْكَافِرُونَ ﴾", q: "المد في (يَا أَيُّهَا) مد متصل؟", opts: ["صح", "خطأ"], ans: 1, note: "خطأ، مد منفصل حكماً." },
          { type: "mcq", verse: "﴿ يَتَسَاءَلُونَ ﴾", q: "المد في (يَتَسَاءَلُونَ) هو:", opts: ["مد واجب متصل", "مد منفصل", "مد عارض", "مد لازم"], ans: 0, note: "مد واجب متصل." },
          { type: "tf", verse: "﴿ الْكَافِرُونَ ﴾", q: "الواو عند الوقف على (الْكَافِرُونَ) تمد مداً عارضاً للسكون؟", opts: ["صح", "خطأ"], ans: 0, note: "صح." },
          { type: "mcq", verse: "﴿ سَوَاءٌ عَلَيْهِمْ ﴾", q: "المد في (سَوَاءٌ):", opts: ["مد متصل", "مد منفصل", "مد عارض", "مد بدل"], ans: 0, note: "مد واجب متصل." },
          { type: "tf", verse: "﴿ فِي جِيدِهَا ﴾", q: "الياء في (جِيدِهَا) مد طبيعي حركتان؟", opts: ["صح", "خطأ"], ans: 0, note: "صح." },
          { type: "mcq", verse: "﴿ وَلَا الضَّالِّينَ ﴾", q: "نوع المد في (الضَّالِّينَ):", opts: ["مد لازم كلمي مثقل", "مد متصل", "مد منفصل", "مد لين"], ans: 0, note: "مد لازم كلمي مثقل 6 حركات." },
          { type: "tf", verse: "﴿ قُرَيْشٍ ﴾", q: "عند الوقف على كلمة (قُرَيْشٍ) يسمى المد مد لين؟", opts: ["صح", "خطأ"], ans: 0, note: "صح." },
          { type: "mcq", verse: "﴿ وَلَا أَنْتُمْ ﴾", q: "المد في (وَلَا أَنْتُمْ):", opts: ["مد جائز منفصل", "مد متصل", "مد عارض", "مد لازم"], ans: 0, note: "مد منفصل." },
          { type: "tf", verse: "﴿ سَيَصْلَى ﴾", q: "الألف المقصورة في (سَيَصْلَى) مد لازم 6 حركات؟", opts: ["صح", "خطأ"], ans: 1, note: "خطأ، مد طبيعي حركتان." },
          { type: "mcq", verse: "﴿ إِيلَافِهِمْ ﴾", q: "الهمزة المسبوقة للياء في (إِيلَافِهِمْ) تسمى:", opts: ["مد بدل", "مد متصل", "مد منفصل", "مد لازم"], ans: 0, note: "مد بدل." },
          { type: "tf", verse: "﴿ خَيْرٌ مِنْ أَلْفِ شَهْرٍ ﴾", q: "المد اللازم يجوز تقصيره لحركتين؟", opts: ["صح", "خطأ"], ans: 1, note: "خطأ، يمد 6 حركات لزوماً." },
          { type: "mcq", verse: "﴿ الْعَالَمِينَ ﴾", q: "يجوز في المد العارض للسكون:", opts: ["2 أو 4 أو 6 حركات", "حركتان فقط", "6 حركات فقط", "لا يمد"], ans: 0, note: "القصر والتوسط والطول (2، 4، 6)." },
          { type: "tf", verse: "﴿ حَآقَّةُ ﴾", q: "المد في (الْحَاقَّةُ) مد لازم كلمي مثقل؟", opts: ["صح", "خطأ"], ans: 0, note: "صح." }
        ],
        gameItems: [
          { word: "جَاءَ", rule: "مد متصل", surah: "النصر" },
          { word: "إِنَّا أَعْطَيْنَاكَ", rule: "مد منفصل", surah: "الكوثر" },
          { word: "الصَّاخَّةُ", rule: "مد لازم", surah: "عبس" },
          { word: "بِالدِّينِ (وقفاً)", rule: "مد عارض للسكون", surah: "الماعون" },
          { word: "وَالسَّمَاءِ", rule: "مد متصل", surah: "الطارق" }
        ],
        baskets: ["مد متصل", "مد منفصل", "مد لازم", "مد عارض للسكون"]
      }
    };

    let curChap = 'noon';
    let curTab = 'cards';
    let curSubRule = 'izhar';
    let curQIdx = 0;
    let score = 0;
    let streak = 0;
    let gameCurIdx = 0;

    // الأصوات التفاعلية (Web Audio API)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function getACtx() { if (!actx) actx = new AudioContext(); return actx; }

    function soundWin() {
      const ctx = getACtx();
      [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
        setTimeout(() => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'triangle'; osc.frequency.setValueAtTime(f, ctx.currentTime);
          g.gain.setValueAtTime(0.3, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.connect(g); g.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.38);
        }, i * 90);
      });
    }

    function soundLose() {
      const ctx = getACtx();
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(170, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(110, ctx.currentTime + 0.25);
      g.gain.setValueAtTime(0.2, ctx.currentTime);
      g.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.26);
    }

    // التنقل بين الأبواب الرئيسية
    document.querySelectorAll('.main-nav-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.main-nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        curChap = btn.getAttribute('data-chapter');
        curSubRule = dataBank[curChap].subRules[0].id;
        curQIdx = 0;
        gameCurIdx = 0;
        renderAll();
      };
    });

    // التنقل بين التبويبات
    document.querySelectorAll('.sec-tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.sec-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        curTab = btn.getAttribute('data-tab');
        document.querySelectorAll('.display-box').forEach(box => box.classList.remove('active'));
        document.getElementById(`box_${curTab}`).classList.add('active');
      };
    });

    function renderAll() {
      renderSubRules();
      renderCards();
      renderExamples();
      renderQuiz();
      renderGame();
    }

    // بناء شريط الأحكام الفرعية
    function renderSubRules() {
      const bar = document.getElementById('subRulesBar');
      bar.innerHTML = '';
      const rules = dataBank[curChap].subRules;
      rules.forEach(r => {
        const chip = document.createElement('button');
        chip.className = `sub-rule-chip ${r.id === curSubRule ? 'active' : ''}`;
        chip.innerText = r.name;
        chip.onclick = () => {
          curSubRule = r.id;
          renderSubRules();
          renderCards();
        };
        bar.appendChild(chip);
      });
    }

    // 1. بناء كروت الشرح للزووم
    function renderCards() {
      const cardBox = document.getElementById('lessonCardContainer');
      const lesson = dataBank[curChap].lessons[curSubRule];
      if (!lesson) {
        cardBox.innerHTML = `<div class="zoom-lesson-card"><div class="zoom-lesson-title">اختر حكماً فرعياً من الشريط بالأعلى لعرض بطاقته الكبرى</div></div>`;
        return;
      }
      let stepsHtml = '';
      lesson.steps.forEach((st, i) => {
        stepsHtml += `<div class="zoom-step-box"><span>📍 الخطوة ${i+1}: </span>${st}</div>`;
      });

      cardBox.innerHTML = `
        <div class="zoom-lesson-card">
          <div class="zoom-lesson-title">
            <span>📖</span>
            <span>${lesson.title}</span>
          </div>
          ${stepsHtml}
          <div class="story-note">${lesson.story}</div>
        </div>
      `;
    }

    // 2. بناء الـ 12 مثالاً بتظليل الحروف المزدوج
    function renderExamples() {
      const grid = document.getElementById('examplesGrid');
      grid.innerHTML = '';
      const exList = dataBank[curChap].examples;
      document.getElementById('examplesTitle').innerText = `12 مثالاً عملياً محققاً من جزء عم مع تظليل حرفي الحكم والسبب:`;

      exList.forEach((ex, idx) => {
        const c = document.createElement('div');
        c.className = 'big-example-card';
        c.innerHTML = `
          <div class="ex-info-row">
            <span>مثال (${idx + 1})</span>
            <span style="color:#facc15;">سورة ${ex.surah}</span>
          </div>
          <div class="verse-banner">﴿ ${ex.verse} ﴾</div>
          <div style="font-size:15px; color:#38bdf8; font-weight:bold; text-align:center;">
            ${ex.rule}
          </div>
        `;
        grid.appendChild(c);
      });
    }

    // 3. بنك الـ 20 تمرين العملاق
    function renderQuiz() {
      const data = dataBank[curChap];
      const q = data.quizzes[curQIdx];
      document.getElementById('quizCounter').innerText = `تمرين ${curQIdx + 1} من ${data.quizzes.length}`;
      document.getElementById('quizType').innerText = q.type === 'mcq' ? 'اختيار من متعدد' : 'صح أم خطأ';
      document.getElementById('quizVerse').innerText = q.verse;
      document.getElementById('quizQ').innerText = q.q;
      document.getElementById('quizFeedback').innerText = '';
      document.getElementById('nextQuizBtn').style.display = 'none';

      const grid = document.getElementById('quizGrid');
      grid.innerHTML = '';

      q.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'giant-opt-btn';
        btn.innerText = opt;
        btn.onclick = () => {
          document.querySelectorAll('.giant-opt-btn').forEach(b => b.disabled = true);
          const fb = document.getElementById('quizFeedback');
          if (idx === q.ans) {
            btn.classList.add('correct');
            fb.style.color = '#4ade80';
            fb.innerText = `🌟 أحسنت بارك الله فيك! ${q.note}`;
            soundWin();
            confetti({ particleCount: 80, spread: 90, origin: { y: 0.6 } });
          } else {
            btn.classList.add('wrong');
            document.querySelectorAll('.giant-opt-btn')[q.ans].classList.add('correct');
            fb.style.color = '#f87171';
            fb.innerText = ` إجابة غير دقيقة. الصواب: ${q.note}`;
            soundLose();
          }
          document.getElementById('nextQuizBtn').style.display = 'inline-block';
        };
        grid.appendChild(btn);
      });
    }

    document.getElementById('nextQuizBtn').onclick = () => {
      const total = dataBank[curChap].quizzes.length;
      curQIdx = (curQIdx + 1) % total;
      renderQuiz();
    };

    // 4. لعبة صائد الأحكام
    function renderGame() {
      const data = dataBank[curChap];
      const item = data.gameItems[gameCurIdx];
      document.getElementById('gameSurah').innerText = `سورة ${item.surah}`;
      document.getElementById('gameWord').innerText = `﴿ ${item.word} ﴾`;

      const box = document.getElementById('gameBaskets');
      box.innerHTML = '';
      data.baskets.forEach(bName => {
        const btn = document.createElement('button');
        btn.className = 'giant-basket-btn';
        btn.innerText = `سلة ${bName}`;
        btn.onclick = () => {
          if (bName === item.rule) {
            score += 10;
            streak++;
            soundWin();
            confetti({ particleCount: 60, spread: 70, origin: { y: 0.7 } });
          } else {
            streak = 0;
            soundLose();
          }
          document.getElementById('gameScore').innerText = score;
          document.getElementById('gameStreak').innerText = streak;
          gameCurIdx = (gameCurIdx + 1) % data.gameItems.length;
          renderGame();
        };
        box.appendChild(btn);
      });
    }

    // التشغيل المبدئي
    renderAll();
  </script>
</body>
</html>
