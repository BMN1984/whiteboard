<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>واحة التفسير ومعاني الكلمات والحديث النبوي — أكاديمية الفتح</title>
  <link rel="manifest" href="manifest.json">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at top, #0f172a 0%, #064e3b 60%, #022c22 100%);
      font-family: 'Cairo', sans-serif;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 60px;
    }

    /* الشريط العلوي */
    .top-header {
      width: 100%;
      background: linear-gradient(90deg, #0f172a, #78350f, #064e3b);
      border-bottom: 3px solid #facc15;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-title {
      font-size: 20px;
      font-weight: 900;
      color: #fef08a;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-btn {
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.25);
      color: #fff;
      padding: 8px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      transition: all 0.25s;
    }
    .nav-btn:hover { background: #d97706; transform: scale(1.05); }

    .main-wrapper {
      width: 95vw;
      max-width: 1100px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* شريط اختيار السورة */
    .surah-picker-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      padding: 14px 20px;
      border-radius: 18px;
      border: 1.5px solid #d97706;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      flex-wrap: wrap;
    }
    .picker-label {
      font-weight: 900;
      color: #facc15;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .surah-select {
      flex: 1;
      min-width: 220px;
      background: #0b111e;
      border: 1.5px solid #38bdf8;
      border-radius: 10px;
      color: #fff;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }

    /* بطاقة الآية المعروضة الكبرى */
    .ayah-display-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 2.5px solid #facc15;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }
    .ayah-quran-text {
      font-family: 'Amiri Quran', serif;
      font-size: 42px;
      line-height: 2.4;
      color: #fef08a;
      text-align: center;
      padding: 16px 20px;
      background: rgba(0,0,0,0.3);
      border-radius: 18px;
      border: 1px dashed rgba(250, 204, 21, 0.4);
    }
    .ayah-nav-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .ctrl-btn {
      background: #0284c7;
      border: 1.5px solid #38bdf8;
      color: #fff;
      padding: 10px 22px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .ctrl-btn:hover { background: #0369a1; transform: scale(1.03); }
    .ayah-indicator {
      font-size: 15px;
      font-weight: 800;
      color: #94a3b8;
    }

    /* أقسام البيان والشرح */
    .section-box {
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sec-words {
      background: rgba(2, 132, 199, 0.12);
      border-right: 5px solid #38bdf8;
    }
    .sec-tafsir {
      background: rgba(245, 158, 11, 0.12);
      border-right: 5px solid #f59e0b;
    }
    .sec-title {
      font-size: 18px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sec-words .sec-title { color: #38bdf8; }
    .sec-tafsir .sec-title { color: #facc15; }
    .sec-content {
      font-size: 18px;
      line-height: 2;
      color: #f1f5f9;
      font-weight: 700;
    }

    /* زر فتح الحديث النبوي */
    .hadith-trigger-btn {
      background: linear-gradient(135deg, #10b981, #047857);
      border: 2px solid #34d399;
      color: #fff;
      padding: 14px 24px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.35);
      transition: all 0.25s;
    }
    .hadith-trigger-btn:hover {
      background: #059669;
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(16, 185, 129, 0.5);
    }

    /* نافذة الحديث النبوي المنبثقة الموسعة للزووم */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .modal-overlay.active { display: flex; }
    .hadith-modal-card {
      background: #0f172a;
      border: 3px solid #34d399;
      border-radius: 24px;
      width: 90vw;
      max-width: 720px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: relative;
      box-shadow: 0 25px 60px rgba(0,0,0,0.9);
      direction: rtl;
    }
    .modal-close-btn {
      position: absolute;
      top: 18px; left: 18px;
      background: #dc2626;
      border: none;
      color: #fff;
      width: 34px; height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }
    .hadith-matn-box {
      font-family: 'Amiri', serif;
      font-size: 24px;
      line-height: 2.2;
      color: #fef08a;
      background: rgba(16, 185, 129, 0.12);
      border-right: 5px solid #10b981;
      padding: 16px 20px;
      border-radius: 12px;
    }
    .hadith-source-text {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 800;
    }
    .hadith-lesson-box {
      font-size: 18px;
      line-height: 1.9;
      color: #f8fafc;
      font-weight: 700;
      background: rgba(255,255,255,0.04);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>

  <div class="top-header">

  <div class="main-wrapper">

    <div class="surah-picker-bar">

      <div class="section-box sec-tafsir">

      <!-- زر الحديث النبوي -->

        <span>عرض الحديث النبوي الشريف المرتبط بالآية وفائدته التربوية</span>
      </button>
    </div>
  </div>

  <!-- النافذة المنبثقة للحديث الشريف -->
  <div class="modal-overlay" id="hadithModal">
    <div class="hadith-modal-card">
      <button class="modal-close-btn" onclick="document.getElementById('hadithModal').classList.remove('active')">✕</button>
      <h3 style="color:#34d399; font-size:22px; font-weight:900; display:flex; align-items:center; gap:8px;">
        <span>🕌</span>
        <span>حديث نبوي شريف مرتبط بالآية الكريمة</span>

      <div class="hadith-matn-box" id="modalHadithMatn"></div>
      <div class="hadith-source-text" id="modalHadithSource"></div>
      <div style="color:#facc15; font-size:16px; font-weight:900;">🌟 الفائدة والشرح التربوي للأطفال والكبار:</div>
      <div class="hadith-lesson-box" id="modalHadithLesson"></div>
    </div>
  </div>

    let curSurah = 1;
    let curAyahIdx = 0;
    let activeModalHadith = null;

    // تعبئة قائمة السور
    const surahSelect = document.getElementById('surahSelect');
    Object.keys(tafsirBank).forEach(sNum => {
      const s = tafsirBank[sNum];
      const opt = document.createElement('option');
      opt.value = sNum;
      opt.innerText = `سورة ${s.name} (${s.ayahs.length} آيات)`;
      surahSelect.appendChild(opt);
    });

    surahSelect.onchange = () => {
      curSurah = parseInt(surahSelect.value);
      curAyahIdx = 0;
      loadAyahData();
    };

    function loadAyahData() {
      const sData = tafsirBank[curSurah];
      const aData = sData.ayahs[curAyahIdx];

      document.getElementById('ayahIndicator').innerText = `الآية ${aData.num} من ${sData.ayahs.length}`;
      document.getElementById('ayahText').innerText = `﴿ ${aData.text} ﴾`;
      document.getElementById('wordsContent').innerHTML = aData.words;
      document.getElementById('tafsirContent').innerText = aData.tafsir;

      activeModalHadith = {
        matn: aData.hadith,
        source: aData.source,
        lesson: aData.lesson
      };
    }

    document.getElementById('nextAyahBtn').onclick = () => {
      const sData = tafsirBank[curSurah];
      if (curAyahIdx < sData.ayahs.length - 1) {
        curAyahIdx++;
        loadAyahData();
      }
    };

    document.getElementById('prevAyahBtn').onclick = () => {
      if (curAyahIdx > 0) {
        curAyahIdx--;
        loadAyahData();
      }
    };

    // فتح نافذة الحديث النبوي
    document.getElementById('openHadithBtn').onclick = () => {
      if (!activeModalHadith) return;
      document.getElementById('modalHadithMatn').innerText = activeModalHadith.matn;
      document.getElementById('modalHadithSource').innerText = `تخريج الحديث: ${activeModalHadith.source}`;
      document.getElementById('modalHadithLesson').innerText = activeModalHadith.lesson;
      document.getElementById('hadithModal').classList.add('active');
      confetti({ particleCount: 50, spread: 70, origin: { y: 0.6 } });
    };

    loadAyahData();
  </script>
