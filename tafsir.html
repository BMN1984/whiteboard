  <style>

    .ayah-quran-text {

    .section-box {

    .hadith-trigger-btn {

    .modal-close-btn {

    .hadith-matn-box {

    .hadith-source-text {

<body>

  <div class="top-header">
    <div class="top-title">
      <span>📖</span>
      <span>التفسير الميسر لمجمع الملك فهد والحديث الشريف — أكاديمية الفتح</span>
    </div>
    <div class="header-actions">
      <a href="index.html" class="nav-btn">↩️ الرجوع للسبورة</a>
    </div>
  </div>

  <div class="main-wrapper">
    <div class="surah-picker-bar">
      <div class="picker-label"><span>📑</span><span>اختر السورة:</span></div>
      <select class="surah-select" id="surahSelect"></select>
      <button class="offline-sync-btn" id="btnSyncTafsirOffline" title="تحميل التفسير الميسر للسورة للعمل بدون إنترنت">
        <span>📥</span>
        <span id="syncBtnText">حفظ تفسير السورة أوفلاين</span>
      </button>
    </div>

    <div class="ayah-display-card">
      <div class="ayah-nav-controls">
        <button class="ctrl-btn" id="prevAyahBtn">⏮️ الآية السابقة</button>
        <span class="ayah-indicator" id="ayahIndicator">الآية 1 من ...</span>
        <button class="ctrl-btn" id="nextAyahBtn">الآية التالية ⏭️</button>
      </div>

      <div class="ayah-quran-text" id="ayahText">﴿ ... ﴾</div>

      <div class="section-box sec-tafsir">
        <div class="sec-title">
          <span>💡</span>
          <span>التفسير الميسر (مجمع الملك فهد لطباعة المصحف الشريف):</span>
        </div>
        <div class="sec-content" id="tafsirContent">جاري جلب التفسير المعتمد...</div>
      </div>

      <button class="hadith-trigger-btn" id="openHadithBtn">
        <span>🕌</span>
        <span>عرض الحديث النبوي المرتبط بالآية وفائدته التربوية</span>
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="hadithModal">
    <div class="hadith-modal-card">
      <button class="modal-close-btn" onclick="document.getElementById('hadithModal').classList.remove('active')">✕</button>
      <h3 style="color:#34d399; font-size:22px; font-weight:900; display:flex; align-items:center; gap:8px;">
        <span>🕌</span>
        <span>حديث نبوي شريف مرتبط بالآية الكريمة</span>
      </h3>
      <div class="hadith-matn-box" id="modalHadithMatn"></div>
      <div class="hadith-source-text" id="modalHadithSource"></div>
      <div style="color:#facc15; font-size:16px; font-weight:900;">🌟 الفائدة والشرح التربوي للأطفال والكبار:</div>
      <div class="hadith-lesson-box" id="modalHadithLesson"></div>
    </div>
  </div>

  <script>
    // قاعدة بيانات محلية للأحاديث النبوية المرتبطة ومقاصد الآيات
    const hadithReferenceBank = {
      "1_1": {
        matn: "قَالَ رَسُولُ اللَّهِ ﷺ: «كُلُّ أَمْرٍ ذِي بَالٍ لاَ يُبْدَأُ فِيهِ بِبِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ فَهُوَ أَقْطَعُ» (أي منقوص البركة).",
        source: "رواه عبد القادر الرهاوي وحسنه الألباني",
        lesson: "البسملة مفتاح البركة في كل أمر؛ عند الأكل والشرب والمذاكرة والبدء في القراءة ليحفظ الله عملك ويبارك فيه."
      },
      "1_2": {
        matn: "قَالَ رَسُولُ اللَّهِ ﷺ: «أَفْضَلُ الذِّكْرِ لاَ إِلَهَ إِلاَّ اللَّهُ، وَأَفْضَلُ الدُّعَاءِ الْحَمْدُ لِلَّهِ».",
        source: "رواه الترمذي وصححه الألباني",
        lesson: "الحمد هو التعبير الأسمى عن شكر الله تعالى على نعمه التي لا تنتهي كنعمة العافية والأهل ونعمة الإسلام."
      },
      "1_5": {
        matn: "قَالَ النَّبِيُّ ﷺ لِابْنِ عَبَّاسٍ: «يَا غُلاَمُ إِنِّي أُعَلِّمُكَ كَلِمَاتٍ: احْفَظِ اللَّهَ يَحْفَظْكَ... إِذَا سَأَلْتَ فَاسْأَلِ اللَّهَ، وَإِذَا اسْتَعَنْتَ فَاسْتَعِنْ بِاللَّهِ».",
        source: "رواه الترمذي وقال: حديث حسن صحيح",
        lesson: "الاعتماد الكامل على الله وحده في كل مطالبنا وصعوباتنا؛ فهو المعين القادر على تيسير الصعاب."
      },
      "112_1": {
        matn: "قَالَ رَسُولُ اللَّهِ ﷺ: «أَيَعْجِزُ أَحَدُكُمْ أَنْ يَقْرَأَ فِي لَيْلَةٍ ثُلُثَ القُرْآنِ؟ قَالُوا: وَكَيْفَ؟ قَالَ: ﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾ تَعْدِلُ ثُلُثَ القُرْآنِ».",
        source: "صحيح البخاري",
        lesson: "عظمة سورة الإخلاص تكمن في صفة الرحمن وتوحيده المطلق، وقراءتها تجلب محبة الله تعالى."
      },
      "113_1": {
        matn: "قَالَ النَّبِيُّ ﷺ لِعُقْبَةَ بْنِ عَامِرٍ: «أَلاَ أُعَلِّمُكَ سُوَرًا مَا أُنْزِلَ فِي التَّوْرَاةِ وَلاَ فِي الإِنْجِيلِ وَلاَ فِي الفُرْقَانِ مِثْلُهُنَّ؟ ﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾، وَ﴿قُلْ أَعُوذُ بِرَبِّ الفَلَقِ﴾، وَ﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ﴾».",
        source: "رواه أحمد والنسائي وصححه الألباني",
        lesson: "المعوذات أعظم ما يتحصن به المسلم صباحاً ومساءً لطرد وساوس الخوف والشر والحسد."
      },
      "114_1": {
        matn: "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا: «أَنَّ النَّبِيَّ ﷺ كَانَ إِذَا أَوَى إِلَى فِرَاشِهِ كُلَّ لَيْلَةٍ جَمَعَ كَفَّيْهِ ثُمَّ نَفَثَ فِيهِمَا فَقَرَأَ فِيهِمَا: ﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾، وَ﴿قُلْ أَعُوذُ بِرَبِّ الفَلَقِ﴾، وَ﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ﴾، ثُمَّ مَسَحَ بِهِمَا مَا اسْتَطَاعَ مِنْ جَسَدِهِ».",
        source: "صحيح البخاري",
        lesson: "سنة نبوية جليلة قبل النوم تحفظ الناشئ والطفل والأسرة من وساوس الشيطان ومن كل سوء."
      }
    };

    // أسماء السور الـ 114
    const surahNames = [
      "الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس",
      "هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه",
      "الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم",
      "لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر",
      "فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق",
      "الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة",
      "الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج",
      "نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس",
      "التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد",
      "الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات",
      "القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر",
      "المسد","الإخلاص","الفلق","الناس"
    ];

    let currentSurah = 1;
    let currentAyahIndex = 0;
    let currentAyahsList = [];

    // إعداد قاعدة بيانات IndexedDB لحفظ التفسير أوفلاين
    let db = null;
    function openTafsirDB() {
      const request = indexedDB.open("AlFatehTafsirDB", 1);
      request.onupgradeneeded = (e) => {
        db = e.target.result;
        if (!db.objectStoreNames.contains("tafsirStore")) {
          db.createObjectStore("tafsirStore", { keyPath: "surah" });
        }
      };
      request.onsuccess = (e) => { db = e.target.result; };
    }
    openTafsirDB();

    // تعبئة قائمة السور
    const surahSelect = document.getElementById('surahSelect');
    surahNames.forEach((name, idx) => {
      const opt = document.createElement('option');
      opt.value = idx + 1;
      opt.innerText = `${idx + 1}. سورة ${name}`;
      surahSelect.appendChild(opt);
    });

    surahSelect.onchange = () => {
      currentSurah = parseInt(surahSelect.value);
      currentAyahIndex = 0;
      loadSurahTafsir(currentSurah);
    };

    // جلب تفسير السورة (أوفلاين أولاً، ثم عبر خادم مجمع الملك فهد)
    async function loadSurahTafsir(surahNum) {
      document.getElementById('ayahText').innerText = "﴿ جاري جلب الآيات الكريمة... ﴾";
      document.getElementById('tafsirContent').innerText = "جاري تحميل نص التفسير الميسر المعتمد...";

      // 1. فحص التخزين المحلي (IndexedDB)
      if (db) {
        const tx = db.transaction("tafsirStore", "readonly");
        const store = tx.objectStore("tafsirStore");
        const req = store.get(surahNum);
        req.onsuccess = () => {
          if (req.result && req.result.ayahs) {
            currentAyahsList = req.result.ayahs;
            renderCurrentAyah();
            return;
          }
          fetchFromCloud(surahNum);
        };
        req.onerror = () => fetchFromCloud(surahNum);
      } else {
        fetchFromCloud(surahNum);
      }
    }

    // جلب نص الآيات مع التفسير الميسر المعتمد رسمياً
    async function fetchFromCloud(surahNum) {
      try {
        const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/editions/quran-uthmani,ar.muyassar`);
        const data = await res.json();
        
        if (data && data.data && data.data.length >= 2) {
          const textAyahs = data.data[0].ayahs;
          const tafsirAyahs = data.data[1].ayahs;

          const merged = textAyahs.map((a, i) => ({
            num: a.numberInSurah,
            text: a.text,
            tafsir: tafsirAyahs[i] ? tafsirAyahs[i].text : "التفسير غير متوفر حالياً."
          }));

          currentAyahsList = merged;

          // تخزين السورة أوفلاين تلقائياً
          if (db) {
            const tx = db.transaction("tafsirStore", "readwrite");
            tx.objectStore("tafsirStore").put({ surah: surahNum, ayahs: merged });
          }

          renderCurrentAyah();
        }
      } catch (err) {
        document.getElementById('ayahText').innerText = "﴿ تعذر الاتصال بالشبكة ﴾";
        document.getElementById('tafsirContent').innerText = "تأكد من توفر الإنترنت لتحميل السورة، أو استخدم زر (حفظ تفسير السورة أوفلاين) مسبقاً.";
      }
    }

    // عرض الآية النشطة وتفسيرها
    function renderCurrentAyah() {
      if (!currentAyahsList || currentAyahsList.length === 0) return;
      const ayah = currentAyahsList[currentAyahIndex];

      document.getElementById('ayahIndicator').innerText = `الآية ${ayah.num} من ${currentAyahsList.length}`;
      document.getElementById('ayahText').innerText = `﴿ ${ayah.text} ﴾`;
      document.getElementById('tafsirContent').innerText = ayah.tafsir;

      const key = `${currentSurah}_${ayah.num}`;
      const hadithBtn = document.getElementById('openHadithBtn');
      if (hadithReferenceBank[key]) {
        hadithBtn.style.display = "flex";
      } else {
        hadithBtn.style.display = "flex";
      }
    }

    document.getElementById('nextAyahBtn').onclick = () => {
      if (currentAyahIndex < currentAyahsList.length - 1) {
        currentAyahIndex++;
        renderCurrentAyah();
      }
    };

    document.getElementById('prevAyahBtn').onclick = () => {
      if (currentAyahIndex > 0) {
        currentAyahIndex--;
        renderCurrentAyah();
      }
    };

    // حفظ تفسير السورة للعمل أوفلاين
    document.getElementById('btnSyncTafsirOffline').onclick = async () => {
      const btnText = document.getElementById('syncBtnText');
      btnText.innerText = "جاري الحفظ أوفلاين...";
      try {
        const res = await fetch(`https://api.alquran.cloud/v1/surah/${currentSurah}/editions/quran-uthmani,ar.muyassar`);
        const data = await res.json();
        if (data && data.data && db) {
          const merged = data.data[0].ayahs.map((a, i) => ({
            num: a.numberInSurah,
            text: a.text,
            tafsir: data.data[1].ayahs[i].text
          }));
          const tx = db.transaction("tafsirStore", "readwrite");
          tx.objectStore("tafsirStore").put({ surah: currentSurah, ayahs: merged });
          tx.oncomplete = () => {
            btnText.innerText = "✓ تم الحفظ للعمل دون إنترنت";
            confetti({ particleCount: 50, spread: 60 });
            setTimeout(() => { btnText.innerText = "حفظ تفسير السورة أوفلاين"; }, 3000);
          };
        }
      } catch (e) {
        btnText.innerText = "تعذر الحفظ، تأكد من الاتصال";
      }
    };

    // عرض نافذة الحديث الشريف
    document.getElementById('openHadithBtn').onclick = () => {
      const ayah = currentAyahsList[currentAyahIndex];
      const key = `${currentSurah}_${ayah ? ayah.num : 1}`;
      const ref = hadithReferenceBank[key] || {
        matn: "قَالَ رَسُولُ اللَّهِ ﷺ: «خَيْرُكُمْ مَنْ تَعَلَّمَ القُرْآنَ وَعَلَّمَهُ».",
        source: "صحيح البخاري",
        lesson: "أعظم شرف وبركة ينالها العبد هي الجلوس في مجالس القرآن وتدبر معانيه والعمل به وتعليمه للآخرين."
      };

      document.getElementById('modalHadithMatn').innerText = ref.matn;
      document.getElementById('modalHadithSource').innerText = `تخريج الحديث: ${ref.source}`;
      document.getElementById('modalHadithLesson').innerText = ref.lesson;
      document.getElementById('hadithModal').classList.add('active');
    };

    // التحميل الأولي لسورة الفاتحة
    loadSurahTafsir(1);
  </script>
</body>
</html>
