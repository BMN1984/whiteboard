<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موسوعة التجويد الكبرى للأطفال والبث المباشر — أكاديمية الفتح</title>
  <link rel="manifest" href="manifest.json">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Amiri+Quran&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at top, #065f46 0%, #064e3b 45%, #022c22 100%);
      font-family: 'Cairo', sans-serif;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      padding-bottom: 60px;
    }

    .top-header {
      width: 100%;
      background: linear-gradient(90deg, #0f172a, #78350f, #064e3b);
      border-bottom: 3px solid #facc15;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-title {
      font-size: 20px;
      font-weight: 900;
      color: #fef08a;
      display: flex;
      align-items: center;
      gap: 12px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .nav-btn {
      background: rgba(255,255,255,0.12);
      border: 1.5px solid rgba(255,255,255,0.25);
      color: #fff;
      padding: 8px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      transition: all 0.25s;
    }
    .nav-btn:hover { background: #d97706; transform: scale(1.05); }

    .main-wrapper {
      width: 95vw;
      max-width: 1200px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .main-nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }
    .main-nav-btn {
      background: #0f172a;
      border: 2px solid #334155;
      color: #e2e8f0;
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 6px 15px rgba(0,0,0,0.4);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .main-nav-btn:hover { border-color: #38bdf8; transform: translateY(-3px); }
    .main-nav-btn.active {
      background: linear-gradient(135deg, #d97706, #92400e);
      border-color: #facc15;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
      transform: scale(1.02);
    }

    .section-tabs {
      display: flex;
      gap: 10px;
      background: rgba(15, 23, 42, 0.85);
      padding: 8px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      flex-wrap: wrap;
    }
    .sec-tab-btn {
      flex: 1;
      min-width: 180px;
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 12px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s;
    }
    .sec-tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.5);
    }

    .sub-rules-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      background: rgba(15, 23, 42, 0.6);
      padding: 12px;
      border-radius: 16px;
      border: 1px dashed rgba(245, 158, 11, 0.4);
    }
    .sub-rule-chip {
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.15);
      color: #cbd5e1;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sub-rule-chip.active {
      background: #10b981;
      border-color: #34d399;
      color: #fff;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.6);
      transform: scale(1.04);
    }

    .display-box {
      background: rgba(15, 23, 42, 0.96);
      border: 3px solid #d97706;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.85);
      display: none;
      animation: fadeIn 0.3s ease forwards;
    }
    .display-box.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .zoom-lesson-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 2px solid #38bdf8;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .zoom-lesson-title {
      font-size: 26px;
      font-weight: 900;
      color: #facc15;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid rgba(255,255,255,0.1);
      padding-bottom: 12px;
    }
    .zoom-step-box {
      background: rgba(2, 132, 199, 0.12);
      border-right: 6px solid #38bdf8;
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 19px;
      line-height: 1.9;
      color: #f1f5f9;
      font-weight: 700;
    }
    .zoom-step-box strong { color: #facc15; }
    .story-note {
      background: rgba(245, 158, 11, 0.16);
      border: 2px dashed #f59e0b;
      border-radius: 16px;
      padding: 18px 24px;
      font-size: 19px;
      color: #fef08a;
      line-height: 1.9;
      font-weight: 800;
    }

    .homework-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 2.5px solid #10b981;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 12px 35px rgba(16, 185, 129, 0.25);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .hw-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(255,255,255,0.1);
      padding-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .hw-title {
      font-size: 24px;
      font-weight: 900;
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .hw-task-box {
      background: rgba(16, 185, 129, 0.1);
      border-right: 6px solid #10b981;
      border-radius: 14px;
      padding: 20px 24px;
      font-size: 19px;
      line-height: 2;
      color: #f8fafc;
      font-weight: 700;
    }
    .hw-steps-list {
      list-style-type: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 10px;
    }
    .hw-steps-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 18px;
      line-height: 1.8;
      color: #e2e8f0;
    }
    .hw-steps-list li span.badge-num {
      background: #10b981;
      color: #0f172a;
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 4px;
    }
    .hw-copy-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      border: 1.5px solid #34d399;
      color: #fff;
      padding: 10px 22px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .examples-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }
    .big-example-card {
      background: linear-gradient(135deg, #1e293b 0%, #0b1329 100%);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      transition: transform 0.25s, border-color 0.25s;
    }
    .big-example-card:hover {
      transform: translateY(-5px);
      border-color: #f59e0b;
    }
    .verse-banner {
      font-family: 'Amiri Quran', serif;
      font-size: 38px;
      line-height: 2.3;
      text-align: center;
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
    }
    .target-char { color: #38bdf8; font-weight: 900; text-shadow: 0 0 14px rgba(56, 189, 248, 0.9); }
    .reason-char { color: #fb923c; font-weight: 900; text-shadow: 0 0 14px rgba(251, 146, 60, 0.9); }
    .ex-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #94a3b8;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 8px;
      font-weight: 800;
    }

    .quiz-giant-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 22px;
    }
    .quiz-giant-verse {
      font-family: 'Amiri Quran', serif;
      font-size: 44px;
      line-height: 2.2;
      color: #fef08a;
      background: rgba(2, 132, 199, 0.12);
      border: 2.5px dashed #38bdf8;
      border-radius: 20px;
      padding: 24px 36px;
      width: 100%;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    .quiz-giant-q { font-size: 24px; font-weight: 900; color: #ffffff; }
    .quiz-giant-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      max-width: 680px;
      direction: rtl;
    }
    .giant-opt-btn {
      background: rgba(255,255,255,0.07);
      border: 2px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 18px;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s;
    }
    .giant-opt-btn:hover { background: rgba(56, 189, 248, 0.25); border-color: #38bdf8; }
    .giant-opt-btn.correct { background: #16a34a !important; border-color: #4ade80 !important; color: #fff !important; transform: scale(1.03); }
    .giant-opt-btn.wrong { background: #dc2626 !important; border-color: #f87171 !important; color: #fff !important; }
    .quiz-feedback-box { font-size: 20px; font-weight: 900; min-height: 40px; line-height: 1.7; }
    .giant-next-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      color: #0f172a;
      font-size: 18px;
      font-weight: 900;
      padding: 12px 36px;
      border-radius: 12px;
      cursor: pointer;
      display: none;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
    }

    .game-giant-arena {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
    }
    .game-target-box {
      width: 100%;
      max-width: 650px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 3px solid #facc15;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 0 30px rgba(250, 204, 21, 0.3);
    }
    .game-target-word { font-family: 'Amiri Quran', serif; font-size: 52px; color: #fef08a; line-height: 2; }
    
    /* شبكة السلال مضبوطة الاتجاه من اليمين إلى اليسار (سلة 1 يمين، سلة 2 وسط، سلة 3 يسار) */
    .game-baskets-grid {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 820px;
      direction: rtl;
    }
    .giant-basket-btn {
      flex: 1;
      background: rgba(2, 132, 199, 0.18);
      border: 2.5px solid #0284c7;
      color: #fff;
      padding: 18px 10px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.25s;
    }
    .giant-basket-btn:hover { background: #0284c7; transform: scale(1.05); }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="top-title">
      <span>🌟</span>
      <span>موسوعة التجويد الكبرى لشرح زووم التفاعلي — جزء عم</span>
    </div>
    <a href="index.html" class="nav-btn">↩️ رجوع للسبورة</a>
  </div>

  <div class="main-wrapper">
    <div class="main-nav">
      <button class="main-nav-btn active" data-chapter="noon">النون الساكنة والتنوين (5 أحكام)</button>
      <button class="main-nav-btn" data-chapter="meem">أحكام الميم الساكنة (3 أحكام)</button>
      <button class="main-nav-btn" data-chapter="qalqala">أحكام القلقلة (3 مراتب)</button>
      <button class="main-nav-btn" data-chapter="madd">أحكام المدود الفرعية (4 أحكام)</button>
    </div>

    <div class="section-tabs">
      <button class="sec-tab-btn active" data-tab="cards">👨‍🏫 كارت الشرح الموسع للزووم</button>
      <button class="sec-tab-btn" data-tab="examples">📜 بنك الـ 10 أمثلة لكل حكم فرعي</button>
      <button class="sec-tab-btn" data-tab="homework">📝 تكليف وواجب الطالب المنزلي</button>
      <button class="sec-tab-btn" data-tab="quiz">📝 20 تمريناً مخصصاً لهذا الفرع</button>
      <button class="sec-tab-btn" data-tab="game">🎯 لعبة صائد أحكام هذا الفرع</button>
    </div>

    <div class="sub-rules-bar" id="subRulesBar"></div>

    <!-- 1. صندوق الشرح -->
    <div class="display-box active" id="box_cards">
      <div id="lessonCardContainer"></div>
    </div>

    <!-- 2. صندوق الأمثلة -->
    <div class="display-box" id="box_examples">
      <h3 style="color:#facc15; font-size:22px; margin-bottom:18px; text-align:center;" id="examplesTitle">10 أمثلة محققة للحكم المختار:</h3>
      <div class="examples-grid" id="examplesGrid"></div>
    </div>

    <!-- 3. صندوق الواجب -->
    <div class="display-box" id="box_homework">
      <div class="homework-card" id="homeworkCard"></div>
    </div>

    <!-- 4. صندوق الـ 20 تمريناً المخصص للحكم الفرعي -->
    <div class="display-box" id="box_quiz">
      <div class="quiz-giant-card">
        <div style="display:flex; gap:10px; align-items:center;">
          <span style="background:#0284c7; padding:4px 18px; border-radius:20px; font-weight:900;" id="quizCounter">تمرين 1 من 20</span>
          <span style="background:rgba(255,255,255,0.1); padding:4px 14px; border-radius:12px; font-weight:800;" id="quizType">اختيار من متعدد</span>
          <span style="background:rgba(245,158,11,0.2); border:1px solid #f59e0b; color:#fef08a; padding:4px 14px; border-radius:12px; font-weight:800;" id="quizBranchBadge">خاص بحكم: الإظهار الحلقي</span>
        </div>
        <div class="quiz-giant-verse" id="quizVerse">﴿ ... ﴾</div>
        <div class="quiz-giant-q" id="quizQ">...</div>
        <div class="quiz-giant-grid" id="quizGrid"></div>
        <div class="quiz-feedback-box" id="quizFeedback"></div>
        <button class="giant-next-btn" id="nextQuizBtn">التالي ❯</button>
      </div>
    </div>

    <!-- 5. صندوق اللعبة المخصصة للحكم الفرعي -->
    <div class="display-box" id="box_game">
      <div class="game-giant-arena">
        <div style="display:flex; gap:20px; font-size:20px; font-weight:900;">
          <div>🏆 النقاط: <span id="gameScore" style="color:#facc15;">0</span></div>
          <div>🔥 التتابع: <span id="gameStreak" style="color:#4ade80;">0</span></div>
          <div style="color:#38bdf8;" id="gameTitleBadge">لعبة تمييز الحكم</div>
        </div>
        <div class="game-target-box">
          <div style="color:#94a3b8; font-size:16px; margin-bottom:8px;" id="gameSurah">سورة الفلق</div>
          <div class="game-target-word" id="gameWord">﴿ غَاسِقٍ إِذَا ﴾</div>
          <div style="color:#38bdf8; font-size:18px; font-weight:800;" id="gameQuestionText">فرز تصنيف الكلمة في السلة الصحيحة:</div>
        </div>
        <div class="game-baskets-grid" id="gameBaskets"></div>
      </div>
    </div>
  </div>

  <script>
    const masterData = {
      noon: {
        title: "النون الساكنة والتنوين",
        subRules: [
          { id: "izhar", name: "1. الإظهار الحلقي" },
          { id: "idgham_g", name: "2. الإدغام بغنة" },
          { id: "idgham_w", name: "3. الإدغام بغير غنة" },
          { id: "iqlab", name: "4. الإقلاب" },
          { id: "ikhfa", name: "5. الإخفاء الحقيقي" }
        ],
        lessons: {
          izhar: {
            title: "الإظهار الحلقي (أصدقاء الحلق الستة: ء، هـ، ع، ح، غ، خ)",
            steps: [
              "<strong>تعريفه للأطفال:</strong> نطق النون الساكنة أو التنوين واضحة وصريحة ونظيفة كالشمس دون زيادة صوت الغنة.",
              "<strong>حروفه:</strong> (الهمزة، الهاء، العين، الحاء، الغين، الخاء).",
              "<strong>كيف ننطقه أمام الكاميرا؟</strong> نقف باللسان برقة على مخرج النون وننطق الحرف الحلقي بعدها بنقاء تام."
            ],
            story: "✨ قصة للأطفال: النون الساكنة تحب أصدقاءها الستة الساكنين في الحلق؛ فعندما تراهم تسلم عليهم بوضوح وتقول: أنا النون الظاهرة!"
          },
          idgham_g: {
            title: "الإدغام بغنة (حفلة الاندماج في يَنْمُو)",
            steps: [
              "<strong>تعريفه للأطفال:</strong> دمج النون الساكنة أو التنوين بالكامل في الحرف الذي يليها ليصبح حرفاً مشدداً مع غنة حركتين كالعصفور.",
              "<strong>حروفه:</strong> مجموعة في كلمة (يَنْمُو) [الياء، النون، الميم، الواو].",
              "<strong>التطبيق:</strong> لا ننطق نوناً نهائياً، بل نتحول مباشرة للحرف التالي مع رنة لطيفة من الأنف."
            ],
            story: "✨ قصة للأطفال: النون شربت عصير الذوبان وذابت تماماً داخل حروف (ينمو) وتركت صوتاً جميلاً يخرج من الأنف!"
          },
          idgham_w: {
            title: "الإدغام بغير غنة (القطار السريع: ر، ل)",
            steps: [
              "<strong>تعريفه للأطفال:</strong> إدخال النون أو التنوين في الراء أو اللام تماماً دون أي مد أو غنة.",
              "<strong>حروفه:</strong> حرفان سريعان وقويان هما (الراء واللام).",
              "<strong>التطبيق:</strong> الانتقال السريع والمشدد إلى الراء أو اللام فوراً."
            ],
            story: "✨ قصة للأطفال: الراء واللام قطار سريع جداً؛ يبتلع النون في طريقه بسرعة البرق دون توقف!"
          },
          iqlab: {
            title: "الإقلاب (النون تتحول لميم خفيفة مع الباء)",
            steps: [
              "<strong>تعريفه للأطفال:</strong> قلب صوت النون الساكنة أو التنوين ميماً مخفاة بغنة حركتين عند ملاقاة حرف الباء.",
              "<strong>حرفه:</strong> حرف واحد فقط هو (الباء).",
              "<strong>علامته في المصحف:</strong> ميم صغيرة قائمة (مـ) فوق الحرف."
            ],
            story: "✨ قصة للأطفال: النون تحترم حرف الباء؛ فتغير ملابسها وتتحول إلى ميم لطيفة مع غنة رقيقة!"
          },
          ikhfa: {

    // دالة خلط عشوائي فيشر-ياتس لضمان توزيع الإجابة الصحيحة في كل مرة
    function shuffleArray(arr) {
      const array = [...arr];
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // بناء 20 تمريناً مخصصاً ومحققاً للفرع النشط
    function buildQuizzesForSubRule(chap, subId) {
      const examples = (masterData[chap] && masterData[chap].examplesBySub && masterData[chap].examplesBySub[subId]) ? masterData[chap].examplesBySub[subId] : [];
      const subObj = masterData[chap].subRules.find(r => r.id === subId);
      const subName = subObj ? subObj.name : "";
      
      const otherRules = masterData[chap].subRules.filter(r => r.id !== subId).map(r => r.name);
      const dist1 = otherRules[0] || "إدغام بغنة";
      const dist2 = otherRules[1] || "إخفاء حقيقي";
      const dist3 = otherRules[2] || "إقلاب";

      const list = [];

      // 1-10: اختيار من متعدد مع خيارات متباينة وموزعة عشوائياً
      for (let i = 0; i < 10; i++) {
        const ex = examples[i % examples.length];
        list.push({
          type: "mcq",
          verse: `﴿ ${ex.verse.replace(/<[^>]*>/g, '')} ﴾`,
          q: `ما الحكم التجويدي للشاهد المذكور في سورة ${ex.surah}؟`,
          correctAnswer: subName,
          opts: [subName, dist1, dist2, dist3],
          note: `الحكم الصحيح هو (${subName}) — الشاهد: ${ex.rule}.`
        });
      }

      // 11-15: صح أم خطأ
      for (let i = 0; i < 5; i++) {
        const ex = examples[i % examples.length];
        const isTrue = (i % 2 === 0);
        list.push({
          type: "tf",
          verse: `﴿ ${ex.verse.replace(/<[^>]*>/g, '')} ﴾`,
          q: isTrue ? `تشتمل هذه الآية الكريمة على حكم (${subName})؟` : `حكم الشاهد في هذه الآية هو الإظهار المطلق؟`,
          correctAnswer: isTrue ? "صح" : "خطأ",
          opts: ["صح", "خطأ"],
          note: `التعليل: الآية مثال معتمد لحكم (${subName}) [${ex.rule}].`
        });
      }

      // 16-20: أسئلة التعليل وحروف السبب
      for (let i = 5; i < 10; i++) {
        const ex = examples[i % examples.length];
        const correctReason = `وقوع الحرف وفق القاعدة: ${ex.rule}`;
        list.push({
          type: "mcq",
          verse: `﴿ ${ex.verse.replace(/<[^>]*>/g, '')} ﴾`,
          q: `ما سبب انطباق حكم (${subName}) في هذا الموضع؟`,
          correctAnswer: correctReason,
          opts: [correctReason, "التقاء ساكنين في كلمتين", "تخفيف الرواية فقط", "سكون عارض لأجل الوقف"],
          note: `السبب التجويدي: ${ex.rule}.`
        });
      }

      return list;
    }

    // بناء لعبة صائد الأحكام بالترتيب الصحيح من اليمين إلى اليسار
    function buildGameForSubRule(chap, subId) {
      const examples = (masterData[chap] && masterData[chap].examplesBySub && masterData[chap].examplesBySub[subId]) ? masterData[chap].examplesBySub[subId] : [];
      const subObj = masterData[chap].subRules.find(r => r.id === subId);
      const subName = subObj ? subObj.name : "";
      
      const otherRules = masterData[chap].subRules.filter(r => r.id !== subId).map(r => r.name);
      const distractor1 = otherRules[0] || "حكم مغاير 1";
      const distractor2 = otherRules[1] || "حكم مغاير 2";

      const items = examples.map(ex => ({
        word: ex.verse.replace(/<[^>]*>/g, ''),
        surah: ex.surah,
        rule: subName
      }));

      return {
        items: items,
        baskets: [subName, distractor1, distractor2]
      };
    }

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function getACtx() { if (!actx) actx = new AudioContext(); return actx; }

    function soundWin() {
      const ctx = getACtx();
      [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
        setTimeout(() => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'triangle'; osc.frequency.setValueAtTime(f, ctx.currentTime);
          g.gain.setValueAtTime(0.3, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.connect(g); g.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.38);
        }, i * 90);
      });
    }

    function soundLose() {
      const ctx = getACtx();
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(170, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(110, ctx.currentTime + 0.25);
      g.gain.setValueAtTime(0.2, ctx.currentTime);
      g.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.26);
    }

      const subObj = masterData[curChap].subRules.find(r => r.id === curSubRule);
      const subName = subObj ? subObj.name : '';
      const exList = masterData[curChap].examplesBySub[curSubRule] || [];

      document.getElementById('examplesTitle').innerText = `10 أمثلة عملية محققة من جزء عم على (${subName}):`;

      exList.forEach((ex, idx) => {
        const c = document.createElement('div');
        c.className = 'big-example-card';
        c.innerHTML = `
          <div class="ex-info-row">
            <span>مثال (${idx + 1})</span>
            <span style="color:#facc15;">سورة ${ex.surah}</span>
          </div>
          <div class="verse-banner">﴿ ${ex.verse} ﴾</div>
          <div style="font-size:15px; color:#38bdf8; font-weight:bold; text-align:center;">
            ${ex.rule}
          </div>
        `;
        grid.appendChild(c);
      });
    }

    function renderHomework() {
      const hwBox = document.getElementById('homeworkCard');
      const hw = masterData[curChap].homeworks[curSubRule];
      if (!hw) {
        hwBox.innerHTML = `<div style="text-align:center; padding:20px; font-size:18px;">اختر حكماً لعرض واجبه المنزلي والتكليف العملي</div>`;
        return;
      }

      let stepsHtml = '';
      hw.steps.forEach((st, i) => {
        stepsHtml += `
          <li>
            <span class="badge-num">${i + 1}</span>
            <div>${st}</div>
          </li>
        `;
      });

      hwBox.innerHTML = `
        <div class="hw-header">
          <div class="hw-title">
            <span>📌</span>
            <span>${hw.title}</span>
          </div>
          <button class="hw-copy-btn" onclick="copyHomeworkText()">
            <span>📋</span>
            <span id="copyBtnText">نسخ نص الواجب لواتساب</span>
          </button>
        </div>
        <div class="hw-task-box">
          <div style="color:#facc15; font-size:20px; margin-bottom:6px;">🎯 التكليف المطلوب من الطالب:</div>
          <div>${hw.task}</div>
          <ul class="hw-steps-list">
            ${stepsHtml}
          </ul>
        </div>
      `;
    }

    window.copyHomeworkText = function() {
      const hw = masterData[curChap].homeworks[curSubRule];
      if (!hw) return;
      let text = `🌟 أكاديمية الفتح لعلوم القرآن 🌟\n`;
      text += `📝 ${hw.title}\n\n`;
      text += `🎯 المطلوب من الطالب:\n${hw.task}\n\n`;
      hw.steps.forEach((s, idx) => {
        text += `${idx + 1}. ${s}\n`;
      });
      text += `\n🌿 نسأل الله التوفيق والفتح المبين لطلابنا الأعزاء!`;

      navigator.clipboard.writeText(text).then(() => {
        const btnText = document.getElementById('copyBtnText');
        if (btnText) {
          btnText.innerText = "✓ تم النسخ بنجاح!";
          setTimeout(() => { btnText.innerText = "نسخ نص الواجب لواتساب"; }, 2500);
        }
      });
    };

    // عرض التمارين مع الخلط العشوائي لمواضع الإجابة الصحيحة
    function renderQuiz() {
      if (!currentSubQuizzes || currentSubQuizzes.length === 0) return;
      const q = currentSubQuizzes[curQIdx % currentSubQuizzes.length];
      document.getElementById('quizCounter').innerText = `تمرين ${(curQIdx % currentSubQuizzes.length) + 1} من ${currentSubQuizzes.length}`;
      document.getElementById('quizType').innerText = q.type === 'mcq' ? 'اختيار من متعدد' : 'صح أم خطأ';
      document.getElementById('quizVerse').innerText = q.verse;
      document.getElementById('quizQ').innerText = q.q;
      document.getElementById('quizFeedback').innerText = '';
      document.getElementById('nextQuizBtn').style.display = 'none';

      const grid = document.getElementById('quizGrid');
      grid.innerHTML = '';

      // خلط الخيارات عشوائياً لضمان تنقل الإجابة الصحيحة بين الأزرار
      const shuffledOptions = shuffleArray(q.opts);

      shuffledOptions.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'giant-opt-btn';
        btn.innerText = opt;
        btn.onclick = () => {
          document.querySelectorAll('.giant-opt-btn').forEach(b => b.disabled = true);
          const fb = document.getElementById('quizFeedback');
          if (opt === q.correctAnswer) {
            btn.classList.add('correct');
            fb.style.color = '#4ade80';
            fb.innerText = `🌟 أحسنت بارك الله فيك! ${q.note}`;
            soundWin();
            confetti({ particleCount: 80, spread: 90, origin: { y: 0.6 } });
          } else {
            btn.classList.add('wrong');
            document.querySelectorAll('.giant-opt-btn').forEach(b => {
              if (b.innerText === q.correctAnswer) b.classList.add('correct');
            });
            fb.style.color = '#f87171';
            fb.innerText = ` إجابة غير دقيقة. الصواب: ${q.note}`;
            soundLose();
          }
          document.getElementById('nextQuizBtn').style.display = 'inline-block';
        };
        grid.appendChild(btn);
      });
    }

    document.getElementById('nextQuizBtn').onclick = () => {
      curQIdx = (curQIdx + 1) % currentSubQuizzes.length;
      renderQuiz();
    };

    // عرض اللعبة وترقيم السلال من اليمين لليسار بدقة (1 يمين، 2 وسط، 3 يسار)
    function renderGame() {
      if (!currentSubGame.items || currentSubGame.items.length === 0) return;
      const item = currentSubGame.items[gameCurIdx % currentSubGame.items.length];
      document.getElementById('gameSurah').innerText = `سورة ${item.surah}`;
      document.getElementById('gameWord').innerText = `﴿ ${item.word} ﴾`;

      const box = document.getElementById('gameBaskets');
      box.innerHTML = '';

      // ترتيب السلال من اليمين لليسار مع ترقيمها الصريح
      currentSubGame.baskets.forEach((bName, index) => {
        const btn = document.createElement('button');
        btn.className = 'giant-basket-btn';
        btn.innerText = `سلة ${index + 1}. ${bName}`;
        btn.onclick = () => {
          if (bName === item.rule) {
            score += 10;
            streak++;
            soundWin();
            confetti({ particleCount: 60, spread: 70, origin: { y: 0.7 } });
          } else {
            streak = 0;
            soundLose();
          }
          document.getElementById('gameScore').innerText = score;
          document.getElementById('gameStreak').innerText = streak;
          gameCurIdx = (gameCurIdx + 1) % currentSubGame.items.length;
          renderGame();
        };
        box.appendChild(btn);
      });
    }

    renderAll();
  </script>
</body>
</html>
