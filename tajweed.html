<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>واحة التجويد التفاعلية للأطفال — أكاديمية الفتح</title>
  <link rel="manifest" href="manifest.json">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Amiri+Quran&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #064e3b;
      font-family: 'Cairo', sans-serif;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 50px;
    }

    /* الشريط العلوي */
    .top-header {
      width: 100%;
      background: linear-gradient(90deg, #0f172a, #78350f, #064e3b);
      border-bottom: 2.5px solid #facc15;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .top-title {
      font-size: 17px;
      font-weight: 900;
      color: #fef08a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-links { display: flex; gap: 10px; }
    .nav-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      transition: all 0.2s;
    }
    .nav-btn:hover { background: #d97706; }

    /* الحاوية الرئيسية */
    .container {
      width: 94vw;
      max-width: 1050px;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* أزرار اختيار الأبواب الرئيسية */
    .chapters-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }
    .chap-btn {
      background: #0f172a;
      border: 2px solid #1e293b;
      color: #cbd5e1;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .chap-btn:hover { border-color: #f59e0b; color: #fff; }
    .chap-btn.active {
      background: linear-gradient(135deg, #d97706, #78350f);
      border-color: #facc15;
      color: #ffffff;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.4);
      transform: translateY(-2px);
    }

    /* تبويبات أركان الدرس الأربعة */
    .tabs-bar {
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.85);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      overflow-x: auto;
    }
    .tab-item {
      flex: 1;
      min-width: 150px;
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .tab-item:hover { color: #fff; }
    .tab-item.active {
      background: #0284c7;
      color: #fff;
      box-shadow: 0 2px 10px rgba(2, 132, 199, 0.4);
    }

    /* البطاقات العامة والمحتوى */
    .content-box {
      background: rgba(15, 23, 42, 0.96);
      border: 2px solid #d97706;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      display: none;
    }
    .content-box.active { display: block; }

    /* 1. قسم دليل المعلم */
    .guide-step {
      background: rgba(30, 41, 59, 0.7);
      border-right: 4px solid #38bdf8;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 12px;
      line-height: 1.8;
    }
    .guide-step-title {
      font-weight: 900;
      color: #38bdf8;
      font-size: 14px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .kid-tip {
      background: rgba(245, 158, 11, 0.15);
      border: 1px dashed #f59e0b;
      padding: 10px 14px;
      border-radius: 10px;
      color: #fef08a;
      font-size: 13px;
      margin-top: 10px;
    }

    /* 2. جدول الأمثلة القرآنية العشرة */
    .examples-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }
    .ex-card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: transform 0.2s;
    }
    .ex-card:hover { transform: translateY(-3px); border-color: #f59e0b; }
    .ex-verse {
      font-family: 'Amiri Quran', serif;
      font-size: 23px;
      color: #facc15;
      line-height: 2.2;
      text-align: center;
    }
    .ex-highlight { color: #38bdf8; font-weight: bold; }
    .ex-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #94a3b8;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 6px;
    }

    /* 3. بنك التمارين (اختياري + صح وخطأ) */
    .quiz-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
    }
    .quiz-badge {
      background: #0284c7;
      color: #fff;
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
    }
    .quiz-type-badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      color: #cbd5e1;
    }
    .quiz-verse {
      font-family: 'Amiri Quran', serif;
      font-size: 32px;
      line-height: 2.2;
      color: #fef08a;
      background: rgba(2, 132, 199, 0.1);
      border: 1px dashed #38bdf8;
      border-radius: 14px;
      padding: 14px 28px;
      width: 100%;
    }
    .quiz-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 580px;
    }
    .q-opt-btn {
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.12);
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .q-opt-btn:hover { background: rgba(56, 189, 248, 0.2); border-color: #38bdf8; }
    .q-opt-btn.correct { background: #16a34a !important; border-color: #4ade80 !important; transform: scale(1.02); }
    .q-opt-btn.wrong { background: #dc2626 !important; border-color: #f87171 !important; }

    .quiz-feedback { font-size: 15px; font-weight: 800; min-height: 30px; line-height: 1.6; }
    .next-q-btn {
      background: #f59e0b;
      border: none;
      color: #0f172a;
      font-size: 14px;
      font-weight: 900;
      padding: 10px 28px;
      border-radius: 8px;
      cursor: pointer;
      display: none;
    }
    .next-q-btn:hover { background: #d97706; }

    /* 4. لعبة صائد أحكام التجويد */
    .game-arena {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }
    .game-stats {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 450px;
      background: #1e293b;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      font-weight: 800;
    }
    .target-card {
      width: 100%;
      max-width: 500px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 2px solid #facc15;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.2);
    }
    .target-word {
      font-family: 'Amiri Quran', serif;
      font-size: 38px;
      color: #fef08a;
      line-height: 2;
    }
    .target-sub { font-size: 12px; color: #94a3b8; }
    .basket-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 500px;
    }
    .basket-btn {
      background: rgba(2, 132, 199, 0.2);
      border: 2px solid #0284c7;
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s;
    }
    .basket-btn:hover { background: #0284c7; transform: scale(1.04); }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="top-title">
      <span>📖</span>
      <span>واحة التجويد التفاعلية المصورة للأطفال — جزء عم</span>
    </div>
    <div class="nav-links">
      <a href="quiz.html" class="nav-btn">🎮 ألعاب جزء عم</a>
      <a href="index.html" class="nav-btn">↩️ الرجوع للسبورة</a>
    </div>
  </div>

  <div class="container">
    <!-- اختيار الباب الرئيسي -->
    <div class="chapters-bar">
      <button class="chap-btn active" data-chapter="noon">النون الساكنة والتنوين (٤ أحكام)</button>
      <button class="chap-btn" data-chapter="meem">أحكام الميم الساكنة (٣ أحكام)</button>
      <button class="chap-btn" data-chapter="qalqala">أحكام القلقلة (قُطْبُ جَدّ)</button>
      <button class="chap-btn" data-chapter="madd">أحكام المدود (متصل، منفصل، عارض، لازم)</button>
    </div>

    <!-- التبويبات الداخلية -->
    <div class="tabs-bar">
      <button class="tab-item active" data-tab="guide">👨‍🏫 خطوات شرح المعلم للطفل</button>
      <button class="tab-item" data-tab="examples">📜 بنك الأمثلة الـ 10 (من جزء عم)</button>
      <button class="tab-item" data-tab="quiz">📝 20 تمريناً (اختياري + صح وخطأ)</button>
      <button class="tab-item" data-tab="game">🎯 لعبة صائد أحكام التجويد</button>
    </div>

    <!-- 1. صندوق دليل المعلم -->
    <div class="content-box active" id="tabContent_guide"></div>

    <!-- 2. صندوق الأمثلة العشرة -->
    <div class="content-box" id="tabContent_examples"></div>

    <!-- 3. صندوق بنك التمارين -->
    <div class="content-box" id="tabContent_quiz">
      <div class="quiz-card">
        <div style="display:flex; gap:8px; align-items:center;">
          <span class="quiz-badge" id="quizCounter">تمرين 1 من 20</span>
          <span class="quiz-type-badge" id="quizTypeBadge">اختيار من متعدد</span>
        </div>
        <div class="quiz-verse" id="quizVerse">﴿ ... ﴾</div>
        <div style="font-size:14px; color:#cbd5e1; font-weight:bold;" id="quizQuestionText">...</div>
        <div class="quiz-options" id="quizOptionsGrid"></div>
        <div class="quiz-feedback" id="quizFeedback"></div>
        <button class="next-q-btn" id="nextQuizBtn">التالي ❯</button>
      </div>
    </div>

    <!-- 4. صندوق اللعبة -->
    <div class="content-box" id="tabContent_game">
      <div class="game-arena">
        <div class="game-stats">
          <div>🏆 النقاط: <span id="gameScore" style="color:#facc15;">0</span></div>
          <div>🔥 التتابع الصحيح: <span id="gameStreak" style="color:#4ade80;">0</span></div>
        </div>
        <div class="target-card">
          <div class="target-sub" id="gameSurahName">سورة عبس</div>
          <div class="target-word" id="gameVerseText">﴿ مِنْ نُطْفَةٍ ﴾</div>
          <div class="target-sub" id="gameHint">اضغط على السلة المناسبة لحكم الكلمة:</div>
        </div>
        <div class="basket-buttons" id="gameBaskets"></div>
      </div>
    </div>
  </div>

  <script>
    // قاعدة البيانات الشاملة والمحققة 3 مرات من جزء عم
    const tajweedBase = {

          { title: "الخطوة الثانية: الإظهار (أصدقاء الحلق الستة)", text: "نقول للطفل: إذا جاء بعد النون حرف من الحلق (ء، هـ، ع، ح، غ، خ) نظهر النون واضحة كالشمس دون زيادة صوت." },

          { title: "الخطوة الخامسة: الإخفاء (النون تختبئ وراء الستار)", text: "مع باقي الحروف الـ 15، النون تختفي ويخرج مكانها صوت رنة لطيفة من الأنف (الغنة)." }

          { verse: "﴿ فَمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ ﴾", surah: "الزلزلة (7)", rule: "إدغام بغنة", word: "فَمَنْ يَعْمَلْ (نون ساكنة بعدها ياء)" },

          { type: "mcq", verse: "﴿ إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ ﴾", q: "مقدار مد المد اللازم الكلمي هو:", opts: ["6 حركات دائماً", "حركتان", "4 حركات", "جائز"], ans: 0, note: "6 حركات لزوماً." }
        ],
        gameItems: [
          { word: "جَاءَ", rule: "مد متصل", surah: "النصر" },
          { word: "إِنَّا أَعْطَيْنَاكَ", rule: "مد منفصل", surah: "الكوثر" },
          { word: "الصَّاخَّةُ", rule: "مد لازم", surah: "عبس" },
          { word: "بِالدِّينِ (عند الوقف)", rule: "مد عارض للسكون", surah: "الماعون" },
          { word: "وَالسَّمَاءِ", rule: "مد متصل", surah: "الطارق" }
        ],
        baskets: ["مد متصل", "مد منفصل", "مد لازم", "مد عارض للسكون"]
      }
    };

    let curChap = 'noon';
    let curTab = 'guide';
    let curQIdx = 0;
    let score = 0;
    let streak = 0;
    let gameCurItem = 0;

    // الأصوات التفاعلية المدمجة
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function getACtx() { if (!actx) actx = new AudioContext(); return actx; }

    function soundWin() {
      const ctx = getACtx();
      [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
        setTimeout(() => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'triangle'; osc.frequency.setValueAtTime(f, ctx.currentTime);
          g.gain.setValueAtTime(0.3, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.connect(g); g.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.32);
        }, i * 85);
      });
    }

    function soundLose() {
      const ctx = getACtx();
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(170, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(110, ctx.currentTime + 0.25);
      g.gain.setValueAtTime(0.2, ctx.currentTime);
      g.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.25);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.26);
    }

    // تبديل الأبواب والتبويبات
    document.querySelectorAll('.chap-btn').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('.chap-btn').forEach(btn => btn.classList.remove('active'));
        b.classList.add('active');
        curChap = b.getAttribute('data-chapter');
        curQIdx = 0;
        gameCurItem = 0;
        renderAll();
      };
    });

    document.querySelectorAll('.tab-item').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('.tab-item').forEach(btn => btn.classList.remove('active'));
        b.classList.add('active');
        curTab = b.getAttribute('data-tab');
        document.querySelectorAll('.content-box').forEach(box => box.classList.remove('active'));
        document.getElementById(`tabContent_${curTab}`).classList.add('active');
      };
    });

    function renderAll() {
      renderGuide();
      renderExamples();
      renderQuiz();
      renderGame();
    }

    // 1. بناء دليل المعلم
    function renderGuide() {
      const data = tajweedBase[curChap];
      const box = document.getElementById('tabContent_guide');
      let html = `<h3 style="color:#facc15; margin-bottom:16px; font-size:18px;">📘 خطوات تدريس وتفهيم حكم (${data.title}) للطفل:</h3>`;
      data.guide.forEach(g => {
        html += `
          <div class="guide-step">
            <div class="guide-step-title"><span>🌟</span><span>${g.title}</span></div>
            <div style="font-size:13px; color:#cbd5e1;">${g.text}</div>
          </div>
        `;
      });
      html += `<div class="kid-tip">${data.kidTip}</div>`;
      box.innerHTML = html;
    }

    // 2. بناء الأمثلة العشرة
    function renderExamples() {
      const data = tajweedBase[curChap];
      const box = document.getElementById('tabContent_examples');
      let html = `<h3 style="color:#facc15; margin-bottom:16px; font-size:18px;">📜 10 أمثلة محققة من جزء عم على (${data.title}):</h3><div class="examples-grid">`;
      data.examples.forEach((ex, idx) => {
        html += `
          <div class="ex-card">
            <div class="ex-meta"><span>مثال ${idx + 1}</span><span>سورة ${ex.surah}</span></div>
            <div class="ex-verse">${ex.verse}</div>
            <div style="font-size:12px; color:#38bdf8; font-weight:bold;">الحكم: ${ex.rule}</div>
            <div style="font-size:11px; color:#cbd5e1;">الشاهد: ${ex.word}</div>
          </div>
        `;
      });
      html += `</div>`;
      box.innerHTML = html;
    }

    // 3. بناء بنك الـ 20 تمرين
    function renderQuiz() {
      const data = tajweedBase[curChap];
      const q = data.quizzes[curQIdx];
      document.getElementById('quizCounter').innerText = `تمرين ${curQIdx + 1} من ${data.quizzes.length}`;
      document.getElementById('quizTypeBadge').innerText = q.type === 'mcq' ? 'اختيار من متعدد' : 'صح أم خطأ';
      document.getElementById('quizVerse').innerText = q.verse;
      document.getElementById('quizQuestionText').innerText = q.q;
      document.getElementById('quizFeedback').innerText = '';
      document.getElementById('nextQuizBtn').style.display = 'none';

      const grid = document.getElementById('quizOptionsGrid');
      grid.innerHTML = '';
      q.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'q-opt-btn';
        btn.innerText = opt;
        btn.onclick = () => {
          document.querySelectorAll('.q-opt-btn').forEach(b => b.disabled = true);
          const fb = document.getElementById('quizFeedback');
          if (idx === q.ans) {
            btn.classList.add('correct');
            fb.style.color = '#4ade80';
            fb.innerText = ` أحسنت بارك الله فيك! ${q.note}`;
            soundWin();
            confetti({ particleCount: 70, spread: 80, origin: { y: 0.6 } });
          } else {
            btn.classList.add('wrong');
            document.querySelectorAll('.q-opt-btn')[q.ans].classList.add('correct');
            fb.style.color = '#f87171';
            fb.innerText = ` إجابة غير دقيقة. الصواب: ${q.note}`;
            soundLose();
          }
          document.getElementById('nextQuizBtn').style.display = 'inline-block';
        };
        grid.appendChild(btn);
      });
    }

    document.getElementById('nextQuizBtn').onclick = () => {
      const total = tajweedBase[curChap].quizzes.length;
      curQIdx = (curQIdx + 1) % total;
      renderQuiz();
    };

    // 4. بناء لعبة صائد أحكام التجويد
    function renderGame() {
      const data = tajweedBase[curChap];
      const item = data.gameItems[gameCurItem];
      document.getElementById('gameSurahName').innerText = `سورة ${item.surah}`;
      document.getElementById('gameVerseText').innerText = `﴿ ${item.word} ﴾`;

      const basketBox = document.getElementById('gameBaskets');
      basketBox.innerHTML = '';
      data.baskets.forEach(bName => {
        const b = document.createElement('button');
        b.className = 'basket-btn';
        b.innerText = `سلة ${bName}`;
        b.onclick = () => {
          if (bName === item.rule) {
            score += 10;
            streak++;
            soundWin();
            confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
          } else {
            streak = 0;
            soundLose();
          }
          document.getElementById('gameScore').innerText = score;
          document.getElementById('gameStreak').innerText = streak;
          gameCurItem = (gameCurItem + 1) % data.gameItems.length;
          renderGame();
        };
        basketBox.appendChild(b);
      });
    }

    // التشغيل الأولي
    renderAll();
  </script>
</body>
</html>
