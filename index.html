<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبورة الفتح التفاعلية</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      overflow: hidden;
      background-color: #121820;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background-color 0.25s ease;
    }
    
    #gridCanvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
    }

    #paintCanvas {
      position: absolute;
      top: 0;
      left: 0;
      cursor: crosshair;
      touch-action: none;
      z-index: 2;
    }

    #overlayCanvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 3;
    }

    .top-dock {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 27, 34, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 6px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: #e6edf3;
      font-size: 13px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      z-index: 1000;
    }

    .side-panel {
      position: fixed;
      top: 70px;
      right: 20px;
      width: 220px;
      background: rgba(22, 27, 34, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 14px;
      color: #e6edf3;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-title {
      font-size: 13px;
      font-weight: bold;
      color: #8b949e;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 5px;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .theme-btn {
      width: 100%;
      height: 30px;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .theme-btn:hover { transform: scale(1.08); }
    .theme-btn.active { border-color: #38bdf8; }

    .grid-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e6edf3;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      text-align: right;
      transition: all 0.2s;
    }
    .btn-action:hover { background: rgba(255, 255, 255, 0.15); }
    .btn-action.active {
      background: #1f6feb;
      border-color: #388bfd;
      color: #fff;
    }

    .bottom-dock {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 27, 34, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      max-width: 95vw;
      overflow-x: auto;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 6px;
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      padding-left: 10px;
    }
    .tool-group:last-child {
      border-left: none;
      padding-left: 0;
    }

    button.tool-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid transparent;
      color: #e6edf3;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    button.tool-btn:hover { background: rgba(255, 255, 255, 0.18); }
    button.tool-btn.active {
      background: #238636;
      border-color: #2ea043;
      color: #fff;
    }

    .color-picker {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .color-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
    }
    .color-dot:hover { transform: scale(1.15); }
    .color-dot.active {
      border-color: #ffffff;
      transform: scale(1.2);
    }

    .slider-box {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #8b949e;
      font-size: 12px;
    }
    input[type="range"] {
      cursor: pointer;
      accent-color: #238636;
    }
    #imageInput { display: none; }
  </style>
</head>
<body>

  <div class="top-dock">
    <span>💡 وضع الشرح النشط</span>
    <button class="tool-btn" id="fullScreenBtn" style="padding: 3px 8px; font-size: 12px;">⛶ ملء الشاشة</button>
  </div>

  <canvas id="gridCanvas"></canvas>
  <canvas id="paintCanvas"></canvas>
  <canvas id="overlayCanvas"></canvas>

  <div class="side-panel">
    <div class="panel-title">لون السبورة</div>
    <div class="theme-grid">
      <div class="theme-btn active" style="background: #121820;" data-bg="#121820" title="كحلي غامق"></div>
      <div class="theme-btn" style="background: #18221b;" data-bg="#18221b" title="أخضر مدرسي"></div>
      <div class="theme-btn" style="background: #111111;" data-bg="#111111" title="أسود كلاسيكي"></div>
      <div class="theme-btn" style="background: #f8fafc;" data-bg="#f8fafc" title="أبيض"></div>
    </div>

    <div class="panel-title">تخطيط الأسطر والشبكة</div>
    <div class="grid-options">
      <button class="btn-action active" data-grid="none">سادة (بدون تسطير)</button>
      <button class="btn-action" data-grid="ruled">مسطر (دفتر مدرسي)</button>
      <button class="btn-action" data-grid="graph">رسم بياني (مربعات)</button>
    </div>

    <div class="panel-title">إدراج وسائط</div>
    <button class="btn-action" id="uploadImageBtn">🖼️ إدراج صورة من الجهاز</button>
    <input type="file" id="imageInput" accept="image/*">

    <div class="panel-title">تصدير الدرس</div>
    <button class="btn-action" id="downloadBtn" style="text-align: center; background: #238636; font-weight: bold;">
      💾 حفظ الشرح كصورة
    </button>
  </div>

  <div class="bottom-dock">
    <!-- أدوات الكتابة والرسم -->
    <div class="tool-group">
      <button class="tool-btn active" data-tool="pen">✏️ قلم</button>
      <button class="tool-btn" data-tool="highlighter">🖊️ تظليل</button>
      <button class="tool-btn" data-tool="laser">🔴 ليزر</button>
      <button class="tool-btn" data-tool="eraser">🧹 ممحاة</button>
    </div>

    <!-- الأشكال الهندسية -->
    <div class="tool-group">
      <button class="tool-btn" data-tool="line">📏 خط</button>
      <button class="tool-btn" data-tool="arrow">➡️ سهم</button>
      <button class="tool-btn" data-tool="rect">▭ مستطيل</button>
      <button class="tool-btn" data-tool="circle">◯ دائرة</button>
    </div>

    <!-- الألوان والسُّمك -->
    <div class="tool-group color-picker">
      <div class="color-dot active" style="background: #ffffff;" data-color="#ffffff"></div>
      <div class="color-dot" style="background: #facc15;" data-color="#facc15"></div>
      <div class="color-dot" style="background: #4ade80;" data-color="#4ade80"></div>
      <div class="color-dot" style="background: #38bdf8;" data-color="#38bdf8"></div>
      <div class="color-dot" style="background: #fb923c;" data-color="#fb923c"></div>
      <div class="color-dot" style="background: #f87171;" data-color="#f87171"></div>
    </div>

    <div class="tool-group slider-box">
      <span>السُّمك</span>
      <input type="range" id="brushSize" min="2" max="35" value="4">
    </div>

    <!-- التحكم والإلغاء -->
    <div class="tool-group">
      <button class="tool-btn" id="undoBtn">↩️ تراجع</button>
      <button class="tool-btn" id="clearBtn">🗑️ مسح الكل</button>
    </div>
  </div>

  <script>
    const paintCanvas = document.getElementById('paintCanvas');
    const pCtx = paintCanvas.getContext('2d');

    const gridCanvas = document.getElementById('gridCanvas');
    const gCtx = gridCanvas.getContext('2d');

    const overlayCanvas = document.getElementById('overlayCanvas');
    const oCtx = overlayCanvas.getContext('2d');

    let currentGrid = 'none';
    let currentThemeBg = '#121820';
    let currentTool = 'pen';
    let currentColor = '#ffffff';
    let currentSize = 4;
    let isDrawing = false;
    let startX = 0, startY = 0;

    let laserPoints = [];
    let history = [];
    const MAX_HISTORY = 15;

    function resizeCanvases() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = paintCanvas.width;
      tempCanvas.height = paintCanvas.height;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.drawImage(paintCanvas, 0, 0);

      [paintCanvas, gridCanvas, overlayCanvas].forEach(c => {
        c.width = window.innerWidth;
        c.height = window.innerHeight;
      });

      pCtx.drawImage(tempCanvas, 0, 0);
      drawGrid();
    }
    window.addEventListener('resize', resizeCanvases);

    [paintCanvas, gridCanvas, overlayCanvas].forEach(c => {
      c.width = window.innerWidth;
      c.height = window.innerHeight;
    });

    function drawGrid() {
      gCtx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
      if (currentGrid === 'none') return;

      const isLightBg = currentThemeBg === '#f8fafc';
      gCtx.strokeStyle = isLightBg ? 'rgba(0, 0, 0, 0.08)' : 'rgba(255, 255, 255, 0.08)';
      gCtx.lineWidth = 1;

      if (currentGrid === 'ruled') {
        const lineSpacing = 44;
        for (let y = lineSpacing; y < gridCanvas.height; y += lineSpacing) {
          gCtx.beginPath();
          gCtx.moveTo(0, y);
          gCtx.lineTo(gridCanvas.width, y);
          gCtx.stroke();
        }
      } else if (currentGrid === 'graph') {
        const step = 40;
        for (let x = 0; x < gridCanvas.width; x += step) {
          gCtx.beginPath();
          gCtx.moveTo(x, 0);
          gCtx.lineTo(x, gridCanvas.height);
          gCtx.stroke();
        }
        for (let y = 0; y < gridCanvas.height; y += step) {
          gCtx.beginPath();
          gCtx.moveTo(0, y);
          gCtx.lineTo(gridCanvas.width, y);
          gCtx.stroke();
        }
      }
    }

    function saveState() {
      if (history.length >= MAX_HISTORY) history.shift();
      history.push(pCtx.getImageData(0, 0, paintCanvas.width, paintCanvas.height));
    }
    saveState();

    function getCoords(e) {
      if (e.touches && e.touches[0]) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function drawArrow(ctx, fromX, fromY, toX, toY) {
      const headLength = 16;
      const angle = Math.atan2(toY - fromY, toX - fromX);
      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - headLength * Math.cos(angle - Math.PI / 6), toY - headLength * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - headLength * Math.cos(angle + Math.PI / 6), toY - headLength * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fillStyle = ctx.strokeStyle;
      ctx.fill();
    }

    function startDraw(e) {
      isDrawing = true;
      const { x, y } = getCoords(e);
      startX = x;
      startY = y;

      if (['pen', 'highlighter', 'eraser'].includes(currentTool)) {
        pCtx.beginPath();
        pCtx.moveTo(x, y);

        if (currentTool === 'eraser') {
          pCtx.globalCompositeOperation = 'destination-out';
          pCtx.lineWidth = currentSize * 4;
        } else if (currentTool === 'highlighter') {
          pCtx.globalCompositeOperation = 'source-over';
          pCtx.strokeStyle = currentColor + '55';
          pCtx.lineWidth = currentSize * 3;
        } else {
          pCtx.globalCompositeOperation = 'source-over';
          pCtx.strokeStyle = currentColor;
          pCtx.lineWidth = currentSize;
        }
        pCtx.lineCap = 'round';
        pCtx.lineJoin = 'round';
      } else if (currentTool === 'laser') {
        laserPoints.push({ x, y, time: Date.now() });
      }
    }

    function draw(e) {
      if (!isDrawing) return;
      const { x, y } = getCoords(e);

      if (['pen', 'highlighter', 'eraser'].includes(currentTool)) {
        pCtx.lineTo(x, y);
        pCtx.stroke();
      } else if (currentTool === 'laser') {
        laserPoints.push({ x, y, time: Date.now() });
      } else {
        // معاينة الأشكال أثناء السحب على طبقة الـ Overlay
        oCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        oCtx.strokeStyle = currentColor;
        oCtx.lineWidth = currentSize;
        oCtx.lineCap = 'round';

        if (currentTool === 'line') {
          oCtx.beginPath();
          oCtx.moveTo(startX, startY);
          oCtx.lineTo(x, y);
          oCtx.stroke();
        } else if (currentTool === 'arrow') {
          drawArrow(oCtx, startX, startY, x, y);
        } else if (currentTool === 'rect') {
          oCtx.strokeRect(startX, startY, x - startX, y - startY);
        } else if (currentTool === 'circle') {
          const radius = Math.hypot(x - startX, y - startY);
          oCtx.beginPath();
          oCtx.arc(startX, startY, radius, 0, Math.PI * 2);
          oCtx.stroke();
        }
      }
    }

    function stopDraw(e) {
      if (!isDrawing) return;
      isDrawing = false;
      const { x, y } = getCoords(e);

      if (['pen', 'highlighter', 'eraser'].includes(currentTool)) {
        pCtx.closePath();
        saveState();
      } else if (['line', 'arrow', 'rect', 'circle'].includes(currentTool)) {
        oCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        pCtx.globalCompositeOperation = 'source-over';
        pCtx.strokeStyle = currentColor;
        pCtx.lineWidth = currentSize;
        pCtx.lineCap = 'round';

        if (currentTool === 'line') {
          pCtx.beginPath();
          pCtx.moveTo(startX, startY);
          pCtx.lineTo(x, y);
          pCtx.stroke();
        } else if (currentTool === 'arrow') {
          drawArrow(pCtx, startX, startY, x, y);
        } else if (currentTool === 'rect') {
          pCtx.strokeRect(startX, startY, x - startX, y - startY);
        } else if (currentTool === 'circle') {
          const radius = Math.hypot(x - startX, y - startY);
          pCtx.beginPath();
          pCtx.arc(startX, startY, radius, 0, Math.PI * 2);
          pCtx.stroke();
        }
        saveState();
      }
    }

    // دورة تحديث مسار الليزر المتلاشي
    function renderLaser() {
      if (laserPoints.length > 0) {
        oCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        const now = Date.now();
        laserPoints = laserPoints.filter(p => now - p.time < 1200);

        for (let i = 1; i < laserPoints.length; i++) {
          const age = now - laserPoints[i].time;
          const alpha = 1 - age / 1200;
          oCtx.strokeStyle = `rgba(239, 68, 68, ${alpha})`;
          oCtx.lineWidth = 6;
          oCtx.lineCap = 'round';
          oCtx.beginPath();
          oCtx.moveTo(laserPoints[i - 1].x, laserPoints[i - 1].y);
          oCtx.lineTo(laserPoints[i].x, laserPoints[i].y);
          oCtx.stroke();
        }
      }
      requestAnimationFrame(renderLaser);
    }
    renderLaser();

    paintCanvas.addEventListener('mousedown', startDraw);
    paintCanvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDraw);

    paintCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); }, { passive: false });
    paintCanvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
    window.addEventListener('touchend', (e) => { stopDraw(e); });

    // تبديل الأدوات
    const toolBtns = document.querySelectorAll('.tool-btn[data-tool]');
    toolBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        toolBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTool = btn.getAttribute('data-tool');
      });
    });

    // تغيير الألوان
    const colorDots = document.querySelectorAll('.color-dot');
    colorDots.forEach(dot => {
      dot.addEventListener('click', () => {
        colorDots.forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        currentColor = dot.getAttribute('data-color');
        if (currentTool === 'eraser') {
          document.querySelector('[data-tool="pen"]').click();
        }
      });
    });

    document.getElementById('brushSize').oninput = (e) => {
      currentSize = parseInt(e.target.value);
    };

    document.getElementById('undoBtn').onclick = () => {
      if (history.length > 1) {
        history.pop();
        pCtx.putImageData(history[history.length - 1], 0, 0);
      }
    };

    document.getElementById('clearBtn').onclick = () => {
      if (confirm('هل تريد مسح كل ما على السبورة؟')) {
        pCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
        saveState();
      }
    };

    // إدراج الصور من الجهاز
    const uploadBtn = document.getElementById('uploadImageBtn');
    const imageInput = document.getElementById('imageInput');

    uploadBtn.onclick = () => imageInput.click();

    function placeImage(src) {
      const img = new Image();
      img.onload = () => {
        const maxWidth = paintCanvas.width * 0.7;
        const scale = Math.min(1, maxWidth / img.width);
        const w = img.width * scale;
        const h = img.height * scale;
        const x = (paintCanvas.width - w) / 2;
        const y = (paintCanvas.height - h) / 2;

        pCtx.globalCompositeOperation = 'source-over';
        pCtx.drawImage(img, x, y, w, h);
        saveState();
      };
      img.src = src;
    }

    imageInput.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => placeImage(ev.target.result);
        reader.readAsDataURL(file);
      }
    };

    // دعم اللصق المباشر (Ctrl + V)
    window.addEventListener('paste', (e) => {
      const items = (e.clipboardData || window.clipboardData).items;
      for (const item of items) {
        if (item.type.indexOf('image') !== -1) {
          const blob = item.getAsFile();
          const reader = new FileReader();
          reader.onload = (ev) => placeImage(ev.target.result);
          reader.readAsDataURL(blob);
        }
      }
    });

    // تبديل خلفيات السبورة والشبكات
    const themeBtns = document.querySelectorAll('.theme-btn');
    themeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        themeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentThemeBg = btn.getAttribute('data-bg');
        document.body.style.backgroundColor = currentThemeBg;

        if (currentThemeBg === '#f8fafc' && currentColor === '#ffffff') {
          currentColor = '#111111';
          colorDots[0].style.background = '#111111';
          colorDots[0].setAttribute('data-color', '#111111');
        } else if (currentThemeBg !== '#f8fafc' && currentColor === '#111111') {
          currentColor = '#ffffff';
          colorDots[0].style.background = '#ffffff';
          colorDots[0].setAttribute('data-color', '#ffffff');
        }
        drawGrid();
      });
    });

    const gridBtns = document.querySelectorAll('.grid-options button');
    gridBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        gridBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentGrid = btn.getAttribute('data-grid');
        drawGrid();
      });
    });

    document.getElementById('fullScreenBtn').onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    };

    document.getElementById('downloadBtn').onclick = () => {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = paintCanvas.width;
      exportCanvas.height = paintCanvas.height;
      const eCtx = exportCanvas.getContext('2d');

      eCtx.fillStyle = currentThemeBg;
      eCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
      eCtx.drawImage(gridCanvas, 0, 0);
      eCtx.drawImage(paintCanvas, 0, 0);

      const link = document.createElement('a');
      link.download = `شرح-السبورة-${new Date().toLocaleDateString('ar-EG')}.png`;
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    };
  </script>
</body>
</html>
