<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبورة تفاعلية</title>
  
  <!-- ربط ملف التنسيقات الخارجي -->
  <link rel="stylesheet" href="style.css">
  
  <!-- مكتبة تشغيل الـ PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <!-- شريط التحكم العلوي -->
  <div class="top-dock">
    <div class="page-controls">
      <button class="mini-btn" id="prevPdfPage">◀</button>
      <span id="pageIndicator">لوحة 1 / 1</span>
      <button class="mini-btn" id="nextPdfPage">▶</button>
    </div>
    <button class="tool-btn" id="fullScreenBtn" style="padding: 3px 8px; font-size: 12px;">⛶ ملء الشاشة</button>
  </div>

  <!-- مساحات الرسم والطبقات -->
  <canvas id="gridCanvas"></canvas>
  <canvas id="pdfCanvas"></canvas>
  <canvas id="paintCanvas"></canvas>
  <canvas id="overlayCanvas"></canvas>

  <!-- القائمة الجانبية: الإعدادات والوسائط -->
  <div class="side-panel">
    <div class="panel-title">لون السبورة</div>
    <div class="theme-grid">
      <div class="theme-btn active" style="background: #121820;" data-bg="#121820" title="كحلي غامق"></div>
      <div class="theme-btn" style="background: #18221b;" data-bg="#18221b" title="أخضر مدرسي"></div>
      <div class="theme-btn" style="background: #111111;" data-bg="#111111" title="أسود كلاسيكي"></div>
      <div class="theme-btn" style="background: #f8fafc;" data-bg="#f8fafc" title="أبيض"></div>
    </div>

    <div class="panel-title">تخطيط الأسطر والشبكة</div>
    <div class="grid-options">
      <button class="btn-action active" data-grid="none">سادة (بدون تسطير)</button>
      <button class="btn-action" data-grid="ruled">مسطر (دفتر مدرسي)</button>
      <button class="btn-action" data-grid="graph">رسم بياني (مربعات)</button>
    </div>

    <div class="panel-title">أدوات الشرح والوسائط</div>
    <button class="btn-action" id="uploadPdfBtn">📑 فتح وشرح ملف PDF</button>
    <input type="file" id="pdfInput" accept="application/pdf">

    <button class="btn-action" id="uploadImageBtn">🖼️ إدراج صورة من الجهاز</button>
    <input type="file" id="imageInput" accept="image/*">

    <div class="panel-title">مصحف الشرح المباشر</div>
    <div class="quran-box">
      <input type="number" id="quranPageNum" class="quran-input" min="1" max="604" placeholder="رقم (1-604)">
      <button class="btn-action" id="loadQuranBtn" style="flex: 1; text-align: center;">عرض الصفحة</button>
    </div>

    <div class="panel-title">تصدير الدرس</div>
    <button class="btn-action" id="downloadBtn" style="text-align: center; background: #238636; font-weight: bold;">
      💾 حفظ الشرح كصورة
    </button>
  </div>

  <!-- شريط الأدوات السفلي العائم -->
  <div class="bottom-dock">
    <div class="tool-group">
      <button class="tool-btn active" data-tool="pen">✏️ قلم</button>
      <button class="tool-btn" data-tool="highlighter">🖊️ تظليل</button>
      <button class="tool-btn" data-tool="laser">🔴 ليزر</button>
      <button class="tool-btn" data-tool="eraser">🧹 ممحاة</button>
    </div>

    <div class="tool-group">
      <button class="tool-btn" data-tool="line">📏 خط</button>
      <button class="tool-btn" data-tool="arrow">➡️ سهم</button>
      <button class="tool-btn" data-tool="rect">▭ مستطيل</button>
      <button class="tool-btn" data-tool="circle">◯ دائرة</button>
    </div>

    <div class="tool-group color-picker">
      <div class="color-dot active" style="background: #ffffff;" data-color="#ffffff"></div>
      <div class="color-dot" style="background: #facc15;" data-color="#facc15"></div>
      <div class="color-dot" style="background: #4ade80;" data-color="#4ade80"></div>
      <div class="color-dot" style="background: #38bdf8;" data-color="#38bdf8"></div>
      <div class="color-dot" style="background: #fb923c;" data-color="#fb923c"></div>
      <div class="color-dot" style="background: #f87171;" data-color="#f87171"></div>
    </div>

    <div class="tool-group slider-box">
      <span>السُّمك</span>
      <input type="range" id="brushSize" min="2" max="35" value="4">
    </div>

    <div class="tool-group">
      <button class="tool-btn" id="undoBtn">↩️ تراجع</button>
      <button class="tool-btn" id="clearBtn">🗑️ مسح الكل</button>
    </div>
  </div>

  <!-- ربط ملف المحرك البرمجي الخارجي -->
  <script src="script.js"></script>
</body>
</html>
